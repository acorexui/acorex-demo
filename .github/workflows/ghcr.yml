
name: Build and push to GHCR and Harbor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/acorexui/demo.acorex.io
  HARBOR_IMAGE: repo.demisco.com/acorex/demo.acorex.io

jobs:
  build-and-push:
    name: Build, Publish and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 90

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image version
        id: version
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: repo.demisco.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.HARBOR_IMAGE }}
          tags: |
            type=sha,prefix=
          labels: |
            org.opencontainers.image.title=ACoreX Demo
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push SHA images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify SHA images
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "$GHCR_IMAGE:$TAG"
          docker buildx imagetools inspect "$HARBOR_IMAGE:$TAG"

          echo "Both registries verified."

      - name: Promote Harbor latest
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            -t "$HARBOR_IMAGE:latest" \
            "$HARBOR_IMAGE:$TAG"

          docker buildx imagetools inspect \
            "$HARBOR_IMAGE:latest"

      - name: Promote GHCR latest
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            -t "$GHCR_IMAGE:latest" \
            "$GHCR_IMAGE:$TAG"

          docker buildx imagetools inspect \
            "$GHCR_IMAGE:latest"

      - name: Publish summary
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## ACoreX Demo - Dual Registry"
            echo ""
            echo "Status: $JOB_STATUS"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "### Images"
            echo ""
            echo "- GHCR: \`$GHCR_IMAGE:$TAG\`"
            echo "- Harbor: \`$HARBOR_IMAGE:$TAG\`"
            echo ""
            echo "Check promotion steps for latest status."
          } >> "$GITHUB_STEP_SUMMARY"
