<div class="flex flex-col items-center justify-center gap-4">
  <ax-button
    (onClick)="modal.open(options)"
    color="primary"
    text="Open Modal"
  ></ax-button>

  <ax-modal #modal>
    <div class="px-4 py-2">
      <ax-title class="text-lg font-medium mb-4">
        Welcome to Modal
      </ax-title>
      <ax-subtitle class="mb-4">
        This is a basic modal dialog. You can customize its appearance and
        behavior using various options.
      </ax-subtitle>
      <ax-subtitle>
        The modal provides a focused way to display content while temporarily
        blocking interaction with the rest of the application.
      </ax-subtitle>
    </div>
  </ax-modal>
</div>
