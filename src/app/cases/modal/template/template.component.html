<div class="flex flex-col items-center justify-center gap-4">
  <ax-button
    (onClick)="handleOpenServiceTemplate()"
    color="primary"
    text="Open Template Modal"
  ></ax-button>

  <ng-template #c>
    <div class="px-4 py-2">
      <ax-title class="text-lg font-medium mb-4">
        Template Content
      </ax-title>
      <ax-subtitle class="mb-4">
        This modal content is created using a template. Templates allow you to
        create complex layouts with custom styling.
      </ax-subtitle>
      <ax-subtitle>
        You can include any HTML content, components, or interactive elements
        within the template.
      </ax-subtitle>
    </div>

    <ax-modal-footer class="px-4 py-2">
      <ax-prefix>
        <ax-button
          color="danger"
          look="outline"
          text="Cancel"
          (onClick)="closeModal()"
        ></ax-button>
      </ax-prefix>
      <ax-suffix>
        <ax-button
          text="Confirm"
          color="primary"
          (onClick)="closeModal()"
        ></ax-button>
      </ax-suffix>
    </ax-modal-footer>
  </ng-template>
</div>
