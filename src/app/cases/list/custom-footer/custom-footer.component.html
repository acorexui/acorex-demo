<div class="size-96">
  <ax-list
    class="default border border-default"
    [dataSource]="dataSource"
    [valueField]="'id'"
    [textField]="'text'"
    multiple="true"
  >
    <ax-footer
      class="sticky top-0 z-10 bg-surface font-semibold"
    >
      <div class="px-2 py-2">
        <span>Your Custom Footer</span>
      </div>
    </ax-footer>
  </ax-list>
</div>
