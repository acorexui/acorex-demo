<div class="size-96">
  <ax-list
    class="default border border-default"
    [dataSource]="dataSource"
    [valueField]="'id'"
    [textField]="'text'"
    multiple="true"
    [itemTemplate]="customItemTemplate"
  >
    <ng-template #customItemTemplate let-item>
      {{ item.data.text }} - {{ item.data.hint }}
    </ng-template>
  </ax-list>
</div>
