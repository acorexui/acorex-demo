<div class="flex w-52 flex-col items-stretch gap-4 py-6">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentColor"
    [dataSource]="dataSource()"
  ></ax-select-box>

  @for (color of [currentColor()]; track color) {
    <div class="flex justify-center">
      <ax-tag
        [text]="tagText()"
        [color]="color"
        look="solid"
        class="w-fit"
      ></ax-tag>
    </div>
  }
</div>
