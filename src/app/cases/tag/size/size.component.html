<div class="flex w-52 flex-col items-stretch gap-4 py-6">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentSize"
    [dataSource]="dataSource()"
  ></ax-select-box>

  @for (size of [currentSize()]; track size) {
    <div class="flex justify-center">
      <ax-tag
        [text]="tagText()"
        color="primary"
        look="solid"
        [class]="size + ' w-fit'"
      ></ax-tag>
    </div>
  }
</div>
