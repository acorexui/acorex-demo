<div class="flex w-72 flex-col items-stretch gap-4 py-6">
  <div class="flex items-center justify-between gap-4">
    <ax-label>Progress bar</ax-label>
    <ax-switch color="primary" [(ngModel)]="timeOutProgress"></ax-switch>
  </div>

  <ax-form-field>
    <ax-label>Timeout (ms)</ax-label>
    <ax-text-box type="number" [(ngModel)]="timeOut"></ax-text-box>
  </ax-form-field>

  <ax-button
    class="w-full"
    color="primary"
    text="Show toast"
    (onClick)="showToast()"
  ></ax-button>
</div>
