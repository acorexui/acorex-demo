<div class="flex flex-col items-center justify-center gap-4">
  <ax-button
    class="w-full"
    color="success"
    text="With Progress Bar"
    (onClick)="showWithProgress()"
  ></ax-button>

  <ax-button
    class="w-full"
    color="warning"
    text="Without Progress Bar"
    (onClick)="showWithoutProgress()"
  ></ax-button>

  <ax-button
    class="w-full"
    color="primary"
    text="Quick Timeout (2s)"
    (onClick)="showQuickTimeout()"
  ></ax-button>

  <ax-button
    class="w-full"
    color="secondary"
    text="Long Timeout (10s)"
    (onClick)="showLongTimeout()"
  ></ax-button>
</div>
