<div
  class="flex flex-col items-center justify-center gap-4 px-4"
>
  <ax-title>Configuration Override</ax-title>
  <ax-subtitle
    >Customizing toast behavior with different configuration
    options</ax-subtitle
  >

  <div class="flex flex-wrap gap-2 justify-center">
    <ax-button
      color="primary"
      text="Custom Config (15s)"
      (onClick)="showWithCustomConfig()"
    ></ax-button>

    <ax-button
      color="success"
      text="Minimal Config"
      (onClick)="showWithMinimalConfig()"
    ></ax-button>

    <ax-button
      color="warning"
      text="Extended Config"
      (onClick)="showWithExtendedConfig()"
    ></ax-button>

    <ax-button
      color="danger"
      text="Custom Location"
      (onClick)="showWithDifferentLocation()"
    ></ax-button>
  </div>
</div>
