<div class="flex w-52 flex-col items-stretch gap-4 py-6">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentColor"
    [dataSource]="dataSource()"
  ></ax-select-box>

  <ax-button
    [color]="currentColor()"
    [text]="buttonText()"
    (onClick)="showToast()"
  ></ax-button>
</div>
