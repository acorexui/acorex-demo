<div class="flex w-52 flex-col items-stretch gap-4 py-6">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentIcon"
    [dataSource]="dataSource()"
  ></ax-select-box>

  <ax-button
    class="w-full"
    [color]="selectedOption().color"
    text="Show toast"
    (onClick)="showToast()"
  ></ax-button>
</div>
