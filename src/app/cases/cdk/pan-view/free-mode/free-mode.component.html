<div class="flex flex-col gap-4">
  <div
    class="w-96 h-96 border border-surface rounded-lg overflow-hidden"
  >
    <img
      src="https://picsum.photos/800/600"
      alt="Free Mode Image"
      axPanView
      [freeMode]="freeMode()"
      class="w-full h-full object-contain"
    />
  </div>

  <ax-button
    (onClick)="toggleFreeMode()"
    [color]="freeMode() ? 'success' : 'default'"
    [text]="freeMode() ? 'Free Mode: ON' : 'Free Mode: OFF'"
  ></ax-button>
</div>
