<div class="flex flex-col gap-4">
  <div
    class="w-96 h-72 border border-surface rounded-lg overflow-hidden"
  >
    <img
      axPanView
      #panViewRef="axPanView"
      src="https://picsum.photos/800/600"
      alt="Zoom Controls Image"
      (zoomChange)="onZoomChange($event)"
      class="w-full h-full object-contain"
    />
  </div>

  <div class="flex gap-2 flex-wrap">
    <ax-button
      text="Zoom In"
      color="primary"
      (onClick)="panViewRef.zoomIn()"
    ></ax-button>
    <ax-button
      text="Zoom Out"
      color="primary"
      (onClick)="panViewRef.zoomOut()"
    ></ax-button>
    <ax-button
      text="Reset"
      color="success"
      (onClick)="panViewRef.resetPosition()"
    ></ax-button>
    <span class="px-3 py-2 bg-surface rounded text-sm">
      Zoom: {{ currentZoom() }}%
    </span>
  </div>
</div>
