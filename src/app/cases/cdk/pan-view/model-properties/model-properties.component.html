<div class="flex gap-4">
  <div class="flex-1">
    <div
      class="w-96 h-72 border border-surface rounded-lg overflow-hidden"
    >
      <img
        src="https://picsum.photos/800/600"
        alt="Model Properties Image"
        axPanView
        [(panX)]="panX"
        [(panY)]="panY"
        [(zoom)]="zoom"
        (positionChange)="onPositionChange($event)"
        (zoomChange)="onZoomChange($event)"
        class="w-full h-full object-contain"
      />
    </div>
  </div>

  <div class="w-64 flex flex-col gap-4">
    <div class="p-4 bg-surface rounded-lg">
      <h4 class="text-lg font-semibold mb-2">Model Values</h4>
      <div class="space-y-2">
        <div>
          <label class="text-sm text-muted">Pan X:</label>
          <div
            class="px-2 py-1 bg-lighter-surface rounded text-sm"
          >
            {{ panX() }}
          </div>
        </div>
        <div>
          <label class="text-sm text-muted">Pan Y:</label>
          <div
            class="px-2 py-1 bg-lighter-surface rounded text-sm"
          >
            {{ panY() }}
          </div>
        </div>
        <div>
          <label class="text-sm text-muted">Zoom:</label>
          <div
            class="px-2 py-1 bg-lighter-surface rounded text-sm"
          >
            {{ zoom() }}%
          </div>
        </div>
      </div>
    </div>

    <ax-button
      color="primary"
      text="Reset View"
      (onClick)="resetView()"
    ></ax-button>
  </div>
</div>
