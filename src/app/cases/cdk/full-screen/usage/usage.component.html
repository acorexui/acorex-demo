<div
          #overlayPanel
          axFullscreen
          #overlayFs="axFullscreen"
          class="flex min-h-48 flex-col justify-between gap-4 rounded p-6 surface"
          (fullscreenChange)="overlayActive.set($event)"
        >
          <div class="flex flex-col gap-3">
            <ax-text class="text-sm opacity-80">
              This panel uses overlay fullscreen. Click the button below or call
              <code>overlayFs.toggle()</code> from code.
            </ax-text>
            <div class="flex items-center gap-2">
              <ax-text class="text-sm">Status:</ax-text>
              <ax-badge
                look="twotone"
                [color]="overlayActive() ? 'success' : 'secondary'"
                [text]="overlayActive() ? 'Active' : 'Inactive'"
              ></ax-badge>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <ax-button
              color="primary"
              [text]="overlayActive() ? 'Exit overlay' : 'Enter overlay'"
              (click)="overlayFs.toggle()"
            ></ax-button>
          </div>
        </div>
