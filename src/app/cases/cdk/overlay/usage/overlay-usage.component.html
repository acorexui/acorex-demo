<div class="flex max-w-xl flex-col gap-8">
  <section class="flex flex-col gap-2">
    <div #templateAnchor class="inline-flex">
      <ax-button
        color="primary"
        text="Open TemplateRef overlay"
        (onClick)="openTemplate()"
      ></ax-button>
    </div>
  </section>
  <section class="flex flex-col gap-2">
    <ax-button text="Open centered overlay" (onClick)="openCentered()"></ax-button>
  </section>
</div>
<ng-template #templatePanel>
  <div class="rounded-lg border border-dashed border-secondary bg-surface p-4 shadow-lg">
    <ax-heading>TemplateRef overlay</ax-heading>
    <ax-text class="mt-2 block text-sm">
      <code>overlay.create(templateRef, &#123; anchorOptions &#125;)</code>
    </ax-text>
    <div class="mt-4 flex justify-end">
      <ax-button text="Close" (onClick)="closeTemplate()"></ax-button>
    </div>
  </div>
</ng-template>
<ng-template #centeredPanel>
  <div class="rounded-lg border-2 border-primary bg-surface p-4 shadow-lg">
    <ax-heading>Centered overlay</ax-heading>
    <ax-text class="mt-2 block text-sm">
      <code>overlay.create(templateRef, &#123; backdrop &#125;)</code>
      — same API; use a component type when you need <code>inputs</code>.
    </ax-text>
    <div class="mt-4 flex justify-end">
      <ax-button text="Close" (onClick)="closeCentered()"></ax-button>
    </div>
  </div>
</ng-template>
