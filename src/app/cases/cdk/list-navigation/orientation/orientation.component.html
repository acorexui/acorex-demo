<div
  orientation="horizontal"
  #f="axListNavigation"
  class="outline-none flex"
  axListNavigation
>
  @for (item of ['Item 1', 'Item 2', 'Item 3']; track $index) {
  <div
    class="p-2"
    [ngClass]="{
      'border border-primary-500 outline-none': a.isActive()
    }"
    #a="axListNavigationItem"
    axListNavigationItem
  >
    {{ item }} {{ a.isActive() }}
  </div>
  }
</div>
