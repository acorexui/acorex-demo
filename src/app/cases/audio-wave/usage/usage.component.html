<div class="w-100 max-w-4xl mx-auto p-4">
  <div
    class="flex items-center gap-3 rounded-lg border border-on-surface bg-surface p-3 shadow-sm"
  >
    <div class="min-w-0 flex-1">
      <ax-audio-wave
        #audioWave
        [config]="waveConfig()"
        (onStatusChanged)="onStatusChanged($event)"
      />
    </div>
    <ax-button class="shrink-0" color="primary" (onClick)="togglePlay()">
      <ax-icon>
        <i
          class="fa-solid"
          [class.fa-play]="!isPlaying()"
          [class.fa-pause]="isPlaying()"
        ></i>
      </ax-icon>
    </ax-button>
  </div>
</div>
