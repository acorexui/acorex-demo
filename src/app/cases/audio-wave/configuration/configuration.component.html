<div class="w-full max-w-4xl mx-auto flex flex-col gap-6 p-4">
  <ax-audio-wave [config]="waveConfig()"></ax-audio-wave>

  <div class="p-4 surface rounded-lg flex flex-col gap-4">
    <ax-title level="4">Wave Configuration</ax-title>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <ax-form-field class="md:col-span-2">
        <ax-label>Audio URL</ax-label>
        <ax-text-box
          [ngModel]="url()"
          (ngModelChange)="url.set($event)"
        ></ax-text-box>
      </ax-form-field>

      <ax-form-field>
        <ax-label>Height</ax-label>
        <ax-number-box
          [value]="height()"
          [minValue]="20"
          [maxValue]="200"
          [step]="4"
          (valueChange)="height.set($event)"
        ></ax-number-box>
      </ax-form-field>

      <ax-form-field>
        <ax-label>Bar Width</ax-label>
        <ax-number-box
          [value]="barWidth()"
          [minValue]="1"
          [maxValue]="20"
          [step]="1"
          (valueChange)="barWidth.set($event)"
        ></ax-number-box>
      </ax-form-field>

      <ax-form-field>
        <ax-label>Bar Gap</ax-label>
        <ax-number-box
          [value]="barGap()"
          [minValue]="0"
          [maxValue]="10"
          [step]="1"
          (valueChange)="barGap.set($event)"
        ></ax-number-box>
      </ax-form-field>

      <ax-form-field>
        <ax-label>Bar Radius</ax-label>
        <ax-number-box
          [value]="barRadius()"
          [minValue]="0"
          [maxValue]="10"
          [step]="1"
          (valueChange)="barRadius.set($event)"
        ></ax-number-box>
      </ax-form-field>

      <ax-form-field>
        <ax-label>Audio Rate</ax-label>
        <ax-number-box
          [value]="audioRate()"
          [minValue]="0.5"
          [maxValue]="2"
          [step]="0.25"
          [decimals]="2"
          (valueChange)="audioRate.set($event)"
        ></ax-number-box>
      </ax-form-field>

      <ax-form-field>
        <ax-label>Wave Color</ax-label>
        <ax-color-box
          [ngModel]="waveColor()"
          (ngModelChange)="waveColor.set($event)"
        ></ax-color-box>
      </ax-form-field>

      <ax-form-field>
        <ax-label>Progress Color</ax-label>
        <ax-color-box
          [ngModel]="progressColor()"
          (ngModelChange)="progressColor.set($event)"
        ></ax-color-box>
      </ax-form-field>
    </div>
  </div>
</div>
