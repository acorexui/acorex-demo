<div class="flex flex-col items-center gap-4">
  <ng-template #dayCellTpl let-data>
    <div class="flex flex-col items-center gap-0.5 leading-none">
      <span class="text-sm font-semibold">{{ data.slot.text }}</span>
      <span class="text-[10px] uppercase opacity-60">{{
        getDayWeekdayLabel(data.slot.date)
      }}</span>
    </div>
  </ng-template>

  <ax-calendar
    [(ngModel)]="customCellDate"
    [activeView]="customCellView()"
    (activeViewChange)="customCellView.set($event)"
    [dayCellTemplate]="dayCellTpl"
    [depth]="'day'"
  ></ax-calendar>
</div>
