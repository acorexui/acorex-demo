<ax-calendar #calendar [(ngModel)]="date">
  <ax-footer>
    <div>
      <div class="mt-2 flex w-full flex-wrap gap-2 gap-x-3">
        <ax-button
          class="ax-sm min-w-0"
          look="outline"
          text="Today"
          (onClick)="setFooterDate(calendar, 0)"
        ></ax-button>
        <ax-button
          class="ax-sm min-w-0"
          look="outline"
          text="Tomorrow"
          (onClick)="setFooterDate(calendar, 1)"
        ></ax-button>
        <ax-button
          class="ax-sm min-w-0"
          look="outline"
          text="In 3 days"
          (onClick)="setFooterDate(calendar, 3)"
        ></ax-button>
        <ax-button
          class="ax-sm min-w-0"
          look="outline"
          text="Next week"
          (onClick)="setFooterDate(calendar, 7)"
        ></ax-button>
        <ax-button
          class="ax-sm min-w-0"
          look="outline"
          text="In 2 weeks"
          (onClick)="setFooterDate(calendar, 14)"
        ></ax-button>
      </div>
    </div>
  </ax-footer>
</ax-calendar>
