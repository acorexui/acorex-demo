<div class="flex flex-col items-center justify-center gap-2">
  <div class="flex gap-2">
    <ax-button
      class="ax-sm min-w-0"
      look="outline"
      text="Shift -7 days"
      (onClick)="shiftWindow(-7)"
    ></ax-button>
    <ax-button
      class="ax-sm min-w-0"
      look="outline"
      text="Shift +7 days"
      (onClick)="shiftWindow(7)"
    ></ax-button>
  </div>

  <ax-calendar [minValue]="min()" [maxValue]="max()"></ax-calendar>
</div>
