<div class="mx-3 flex flex-col items-center">
  <div
    #host
    class="max-w-3xl overflow-hidden rounded-lg bg-neutral-900 shadow-lg"
  >
    <div class="relative aspect-video bg-black">
      <video
        #video
        class="h-full w-full object-contain"
        [src]="src()"
        playsinline
        preload="metadata"
        (play)="onPlayStateChange(true)"
        (pause)="onPlayStateChange(false)"
        (ended)="onEnded()"
        (timeupdate)="onTimeUpdate()"
        (loadedmetadata)="onLoadedMetadata()"
        (volumechange)="onVolumeChange()"
      ></video>
    </div>

    <div
      class="flex flex-col gap-3 border-t border-neutral-700 p-4 text-neutral-100"
    >
      <div class="flex items-center gap-3">
        <input
          type="range"
          class="min-h-6 flex-1 cursor-pointer"
          min="0"
          max="100"
          step="0.1"
          [value]="seekPercent()"
          (input)="onSeekInput($event)"
          (change)="onSeekCommit()"
          [attr.aria-valuetext]="timeLabel()"
        />
        <span
          class="shrink-0 tabular-nums text-xs text-neutral-400"
        >
          {{ timeLabel() }}
        </span>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <ax-button color="default" (click)="skip(-10)" title="Back 10 seconds">
          <ax-icon>
            <i class="fa-solid fa-backward"></i>
          </ax-icon>
        </ax-button>

        <ax-button color="primary" (click)="togglePlay()" title="Play or pause">
          <ax-icon>
            <i [class]="playIconClass()"></i>
          </ax-icon>
        </ax-button>

        <ax-button
          color="default"
          (click)="skip(10)"
          title="Forward 10 seconds"
        >
          <ax-icon>
            <i class="fa-solid fa-forward"></i>
          </ax-icon>
        </ax-button>

        <ax-button
          color="default"
          (click)="toggleMute()"
          [title]="isMuted() ? 'Unmute' : 'Mute'"
        >
          <ax-icon>
            @if (isMuted()) {
              <i class="fa-solid fa-volume-xmark"></i>
            } @else {
              <i class="fa-solid fa-volume-high"></i>
            }
          </ax-icon>
        </ax-button>

        <label class="flex flex-1 items-center gap-2">
          <span class="sr-only">Volume</span>
          <i class="fa-solid fa-volume-low text-neutral-500"></i>
          <input
            type="range"
            class="min-h-6 flex-1 cursor-pointer"
            min="0"
            max="100"
            step="1"
            [value]="volumePercent()"
            (input)="onVolumeInput($event)"
          />
        </label>

        <div class="flex flex-1 items-center gap-1">
          @for (rate of playbackRates; track rate) {
            <ax-button
              [color]="playbackRate() === rate ? 'primary' : 'default'"
              class="min-w-[4rem] px-2"
              (click)="setPlaybackRate(rate)"
              [title]="'Playback speed ' + rate + '×'"
            >
              {{ rate }}×
            </ax-button>
          }
        </div>

        <ax-button
          color="default"
          (click)="toggleFullscreen()"
          title="Fullscreen"
        >
          <ax-icon>
            <i class="fa-solid fa-expand"></i>
          </ax-icon>
        </ax-button>
      </div>
    </div>
  </div>
</div>
