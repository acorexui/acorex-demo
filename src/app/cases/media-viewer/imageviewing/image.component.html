<div class="mx-[5rem] flex flex-col gap-4">
  <div class="flex flex-wrap items-center gap-2">
    <ax-button
      [color]="fit() === 'contain' ? 'primary' : 'default'"
      (click)="setFit('contain')"
      class="min-w-[5rem]"
      title="Fit: contain"
    >
      Contain
    </ax-button>
    <ax-button
      [color]="fit() === 'cover' ? 'primary' : 'default'"
      (click)="setFit('cover')"
      title="Fit: cover"
      class="min-w-[5rem]"
    >
      Cover
    </ax-button>

    <ax-button color="default" (click)="rotateLeft()" title="Rotate left">
      <ax-icon><i class="fa-solid fa-rotate-left"></i></ax-icon>
    </ax-button>
    <ax-button color="default" (click)="rotateRight()" title="Rotate right">
      <ax-icon><i class="fa-solid fa-rotate-right"></i></ax-icon>
    </ax-button>

    <ax-button
      color="default"
      (click)="resetView()"
      title="Reset view"
      class="min-w-[5rem]"
    >
      Reset
    </ax-button>

    <label
      class="flex items-center gap-2 text-sm text-neutral-500"
    >
      <span class="text-neutral-600 dark:text-neutral-400">Zoom</span>
      <input
        type="range"
        min="50"
        max="300"
        step="1"
        class="min-h-6 w-56 cursor-pointer"
        [value]="zoom()"
        (input)="setZoomFromSlider($event)"
      />
      <span class="w-12 text-right tabular-nums">{{
        zoomLabel()
      }}</span>
    </label>
  </div>

  <div
    #viewport
    class="relative h-[28rem] w-full overflow-hidden rounded-lg border border-neutral-200 bg-neutral-50 dark:border-neutral-700 dark:bg-neutral-900"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
  >
    <img
      [src]="src()"
      [class]="viewportClass()"
      class="absolute left-auto top-auto h-full w-full select-none"
      [style]="imageStyle()"
      draggable="false"
      alt="Showcase image"
    />

    <div
      class="absolute bottom-3 left-3 rounded bg-black/60 px-2 py-1 text-xs text-white"
    >
      Drag to pan • Zoom {{ zoomLabel() }} • Rotate {{ rotate() }}°
    </div>
  </div>
</div>
