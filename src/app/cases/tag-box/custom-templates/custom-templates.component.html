<div class="w-full min-w-[30rem]">
  <ax-tag-box
    #tagBox
    [tagTemplate]="tagTemplate"
    [(ngModel)]="tagBoxValue"
    [allowDuplicateValues]="false"
    placeholder="Search and add skills..."
    (onValueChanged)="handleValueChange($event)"
    (onTagClick)="onTagClick($event)"
    (onTagDblClick)="onTagDblClick($event)"
    (onTagContextMenu)="onTagContextMenu($event)"
  >
    <ax-clear-button></ax-clear-button>
    <ax-autocomplete
      valueField="id"
      textField="text"
      [multiple]="true"
      [itemHeight]="56"
      [dataSource]="data()"
      [itemTemplate]="itemTemplate"
      [emptyTemplate]="emptyTemplate"
      [loadingTemplate]="loadingTemplate"
    ></ax-autocomplete>
  </ax-tag-box>
</div>

<div class="mt-4 w-full max-w-2xl">
  <ax-title size="sm">Selected Items ({{ tagBoxValue().length }})</ax-title>
  <div class="mt-2 flex flex-wrap gap-2">
    @for (item of tagBoxValue(); track item.id) {
      <ax-tag
        [text]="item.text"
        [color]="item.color"
        look="twotone"
        (onClick)="onTagClick($event)"
      >
        <ax-prefix>
          <ax-icon [class]="getCategoryIcon(item.category)"></ax-icon>
        </ax-prefix>
      </ax-tag>
    }
  </div>
</div>

<!-- Custom Tag Template -->
<ng-template #tagTemplate let-item let-index="index">
  <ax-tag
    [text]="item.text"
    [color]="item.color"
    look="twotone"
    (onClick)="onTagClick($event)"
  >
    <ax-prefix>
      <ax-icon [class]="getCategoryIcon(item.category)"></ax-icon>
    </ax-prefix>
    <ax-suffix>
      <button (click)="tagBoxComponent()?.removeItem(index)" type="button">
        <ax-icon class="icon icon-close"></ax-icon>
      </button>
    </ax-suffix>
  </ax-tag>
</ng-template>

<!-- Custom Autocomplete Item Template -->
<ng-template #itemTemplate let-context>
  @let item = context.data;
  <div class="flex w-full items-center gap-3 rounded p-2 transition-colors">
    <div
      class="flex h-8 w-8 items-center justify-center rounded-full"
      [ngClass]="{
        'bg-primary-500/15 text-primary-500': item.color === 'primary',
        'bg-success-500/15 text-success-500': item.color === 'success',
        'bg-danger-500/15 text-danger-500': item.color === 'danger',
        'bg-warning-500/15 text-warning-500': item.color === 'warning',
        'bg-info-500/15 text-info-500': item.color === 'info',
        'bg-muted-500/15 text-muted-500': item.color === 'muted',
      }"
    >
      <ax-icon [class]="getCategoryIcon(item.category)"></ax-icon>
    </div>
    <div class="flex-1">
      <ax-title>{{ item.text }}</ax-title>
      <ax-subtitle>{{ item.description }}</ax-subtitle>
    </div>
    <div class="flex items-center gap-1">
      <ax-tag
        [text]="getCategoryLabel(item.category)"
        [color]="item.color"
        look="outline"
        size="xs"
      ></ax-tag>
    </div>
  </div>
</ng-template>

<!-- Custom Empty Template -->
<ng-template #emptyTemplate>
  <div class="flex flex-col items-center justify-center px-4 py-8">
    <ax-icon
      class="fa-light fa-magnifying-glass mb-2 text-4xl text-gray-400"
    ></ax-icon>
    <ax-title>No results found</ax-title>
  </div>
</ng-template>

<!-- Custom Loading Template -->
<ng-template #loadingTemplate>
  <div class="flex items-center justify-center py-4">
    <div class="flex items-center gap-2">
      <div
        class="animate-spin h-4 w-4 rounded-full border-2 border-primary border-t-transparent"
      ></div>
      <span class="text-sm text-gray-500">Searching...</span>
    </div>
  </div>
</ng-template>
