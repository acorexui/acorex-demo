<div class="w-full flex justify-center items-center">
  <ax-button
    color="primary"
    [axTooltip]="custom"
    [text]="'Show Tooltip'"
    [axTooltipPlacement]="'top'"
  ></ax-button>
  <ng-template #custom>
    <div class="overlay-pane p-4">
      <p class="text-sm">
        <b>Title</b><br />
        Lorem ipsum dolor sit amet consectetur adipisicing elit.<br />
        Necessitatibus ipsum suscipit esse velit
      </p>
      <p class="mt-4">
        <ax-button class="ax-xs" text="Okay" color="success"></ax-button>
      </p>
    </div>
  </ng-template>
</div>
