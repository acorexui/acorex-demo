<div
  class="flex flex-col items-center justify-center gap-4 p-4"
>
  <div class="w-full max-w-2xl">
    <div
      axUploaderZone
      [overlayTemplate]="customOverlayTemplate"
      (fileChange)="onFileChange($event)"
      class="flex justify-center items-center border-2 border-dashed surface rounded-lg p-8 text-center hover:lighter-surface transition-colors"
      style="min-height: 300px"
    >
      <div class="flex flex-col items-center gap-6">
        <div class="text-4xl">📁</div>
        <div>
          <ax-title>Upload Files</ax-title>
          <ax-subtitle>
            Drag and drop files here or click anywhere to browse
          </ax-subtitle>
        </div>
      </div>
    </div>
  </div>

  @if (selectedFiles().length > 0) {
  <div class="w-full max-w-2xl surface rounded-lg p-4">
    <div class="flex items-center justify-between mb-2">
      <ax-title>Selected Files</ax-title>
      <ax-button
        (onClick)="clearFiles()"
        text="Clear"
        color="danger"
        size="sm"
      ></ax-button>
    </div>
    <ul class="space-y-2">
      @for (file of selectedFiles(); track file.name) {
      <li
        class="flex items-center gap-2 p-2 dark-surface rounded"
      >
        <span class="text-sm">📄</span>
        <span class="text-sm flex-1">{{ file.name }}</span>
        <span class="text-xs text-muted">
          {{ (file.size / 1024).toFixed(2) }} KB
        </span>
      </li>
      }
    </ul>
  </div>
  }
</div>

<!-- Custom Overlay Template -->
<ng-template #customOverlayTemplate>
  <div
    class="flex flex-col items-center justify-center gap-4 p-8"
  >
    <div class="text-6xl custom-overlay-icon">🎯</div>
    <div class="text-center">
      <ax-title style="font-size: 1.5rem; line-height: 2rem"
        >Drop Files Here</ax-title
      >
      <ax-subtitle style="margin-top: 0.5rem">
        Release to upload your files
      </ax-subtitle>
    </div>
    <div class="flex gap-2" style="margin-top: 1rem">
      <div class="w-2 h-2 rounded-full custom-overlay-dot"></div>
      <div class="w-2 h-2 rounded-full custom-overlay-dot"></div>
      <div class="w-2 h-2 rounded-full custom-overlay-dot"></div>
    </div>
  </div>
</ng-template>
