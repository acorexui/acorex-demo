<div
  class="flex flex-col items-center justify-center gap-4 p-4"
>
  <div class="w-full max-w-2xl">
    <div
      axUploaderZone
      (fileChange)="onFileChange($event)"
      class="border-2 border-dashed surface rounded-lg p-8 text-center hover:lighter-surface transition-colors"
    >
      <div class="flex flex-col items-center gap-4">
        <div class="text-4xl">📁</div>
        <div>
          <ax-title>Upload Files</ax-title>
          <ax-subtitle>
            Click the button below to browse for files. The <code>axUploaderBrowseHandle</code> directive enables click-to-browse functionality.
          </ax-subtitle>
        </div>
        <ax-button axUploaderBrowseHandle text="Browse Files" color="primary">
        </ax-button>
      </div>
    </div>
  </div>
</div>
