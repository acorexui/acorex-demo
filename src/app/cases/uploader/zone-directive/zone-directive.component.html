<div
  class="flex flex-col items-center justify-center gap-4 p-4"
>
  <div class="flex gap-2 mb-4 flex-wrap">
    <ax-button
      (onClick)="toggleMultiple()"
      [text]="multiple() ? 'Single File' : 'Multiple Files'"
    >
    </ax-button>
    <ax-button (onClick)="setAcceptImages()" text="Images Only"></ax-button>
    <ax-button
      (onClick)="setAcceptDocuments()"
      text="Documents Only"
    ></ax-button>
    <ax-button (onClick)="setAcceptAll()" text="All Files"></ax-button>
  </div>

  <div class="w-full max-w-2xl">
    <div
      axUploaderZone
      [accept]="$any(accept)"
      [multiple]="multiple()"
      (fileChange)="onFileChange($event)"
      (dragEnter)="onDragEnter($event)"
      (dragLeave)="onDragLeave($event)"
      (dragOver)="onDragOver($event)"
      class="border-2 border-dashed surface rounded-lg p-8 text-center hover:lighter-surface transition-colors"
    >
      <div class="flex flex-col items-center gap-4">
        <div class="text-4xl">📁</div>
        <div>
          <ax-title>Drop files here</ax-title>
          <ax-subtitle>
            {{ multiple() ? "Multiple files allowed" : "Single file only" }}
          </ax-subtitle>
          <ax-subtitle>
            {{
              accept ? "Accepted types: " + accept : "All file types accepted"
            }}
          </ax-subtitle>
        </div>
      </div>
    </div>
  </div>
</div>
