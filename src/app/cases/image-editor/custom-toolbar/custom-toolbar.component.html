<ax-form class="w-full max-w-3xl">
  <ax-form-field class="w-100">
    <ax-image-editor-container
      [look]="options().look"
      (onValueChanged)="saveHandler($event)"
      class="w-full"
    >
      <ax-header>
        <ax-toolbar>
          <ax-prefix>
            <ax-image-editor-history />
          </ax-prefix>
        </ax-toolbar>
      </ax-header>

      <ax-image-editor-view src="https://picsum.photos/600/600" />

      <ax-footer>
        <ax-image-editor-tools-bar>
          <ax-image-editor-pen />
          <ax-image-editor-crop [aspectRatio]="cropAspectRatios()" />
          <ax-image-editor-rotate />
        </ax-image-editor-tools-bar>
      </ax-footer>

      <ax-validation-rule
        rule="callback"
        [options]="{ validate: validateFn }"
      />
    </ax-image-editor-container>
  </ax-form-field>
</ax-form>
