<div class="flex items-center justify-center gap-4">
  <ax-rail-navigation look="pills-color" class="h-[100vh]">
    @for (item of items(); track $index) {
    <ax-rail-navigation-item
      [active]="isActive($index)"
      (onClick)="onItemClick($event, $index)"
    >
      <ax-icon [class]="item.icon"></ax-icon>
      <ax-text>{{ item.text }}</ax-text>
    </ax-rail-navigation-item>
    }
    <ax-suffix>
      <ax-rail-navigation-item>
        <ax-icon class="fa-solid fa-sun-bright"></ax-icon>
      </ax-rail-navigation-item>
    </ax-suffix>
  </ax-rail-navigation>

  <div class="flex-1 flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <h3 class="text-lg font-semibold">Programmatic Control</h3>
      <p class="text-sm text-surface-low">
        Use the AXRailNavigationService to programmatically control which item
        is active.
      </p>
      <div class="flex gap-2 flex-wrap">
        @for (item of items(); track $index) {
        <ax-button
          [text]="'Set ' + item.text + ' Active'"
          class="ax-sm"
          [look]="isActive($index) ? 'solid' : 'outline'"
          (onClick)="setActiveProgrammatically($index)"
        >
        </ax-button>
        }
      </div>
    </div>
  </div>
</div>
