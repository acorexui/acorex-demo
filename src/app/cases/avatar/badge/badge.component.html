<div
  class="flex flex-col items-center justify-center gap-4 py-6"
>
  <div class="flex items-center justify-center gap-6">
    <ax-avatar [size]="64">
      <ax-text>AM</ax-text>
      <ax-badge
        [color]="
          status() === 'online'
            ? 'success'
            : status() === 'busy'
            ? 'warning'
            : 'secondary'
        "
        class="absolute bottom-0 right-0"
      >
      </ax-badge>
    </ax-avatar>

    <ax-avatar color="primary" [size]="64">
      <ax-icon><i class="fa-light fa-user"></i></ax-icon>
      <ax-badge
        [color]="
          status() === 'online'
            ? 'success'
            : status() === 'busy'
            ? 'warning'
            : 'secondary'
        "
        class="absolute bottom-0 right-0"
      >
      </ax-badge>
    </ax-avatar>

    <ax-avatar [size]="64">
      <ax-image src="https://i.pravatar.cc/300"></ax-image>
      <ax-badge
        [color]="
          status() === 'online'
            ? 'success'
            : status() === 'busy'
            ? 'warning'
            : 'secondary'
        "
        class="absolute bottom-0 right-0"
      >
      </ax-badge>
    </ax-avatar>
  </div>

  <ax-button
    (onClick)="cycle()"
    text="Change status ({{ status() }})"
  ></ax-button>
</div>
