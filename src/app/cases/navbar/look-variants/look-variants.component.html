<div class="flex w-[40rem] flex-col items-center gap-4">
  <div class="flex items-center gap-2">
    <ax-label>Select Look:</ax-label>
    <ax-select-box
      [dataSource]="lookOptions"
      textField="text"
      valueField="value"
      [(ngModel)]="selectedLook"
      class="w-32"
    >
    </ax-select-box>
  </div>

  <div
    class="flex w-full flex-col items-center justify-center rounded-lg bg-dark p-4 dark:bg-light"
  >
    <ax-navbar [look]="selectedLook()">
      <ax-prefix>
        <ax-button color="default" look="blank">
          <ax-icon><i class="fa-solid fa-bars"></i></ax-icon>
        </ax-button>
      </ax-prefix>
      <ax-title>Navbar - {{ selectedLook() | titlecase }}</ax-title>
      <ax-suffix>
        <ax-button color="default" look="blank">
          <ax-icon><i class="fa-solid fa-user"></i></ax-icon>
        </ax-button>
        <ax-button color="default" look="blank">
          <ax-icon><i class="fa-solid fa-bell"></i></ax-icon>
        </ax-button>
      </ax-suffix>
    </ax-navbar>
  </div>
</div>
