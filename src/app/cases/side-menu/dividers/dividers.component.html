<div class="flex flex-col gap-4">
  <div
    class="w-60 rounded-md bg-primary-surface p-2 text-primary-on-surface"
  >
    <ax-side-menu>
      <ax-side-menu-item
        [active]="menu.isActive('dashboard')"
        (onClick)="menu.select('dashboard', $event)"
      >
        <span>Dashboard</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-gauge-simple"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
      <ax-divider></ax-divider>
      <ax-side-menu-item
        [active]="menu.isActive('users')"
        (onClick)="menu.select('users', $event)"
      >
        <span>Users</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-user-group"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
      <ax-divider></ax-divider>
      <ax-side-menu-item
        [active]="menu.isActive('reports')"
        (onClick)="menu.select('reports', $event)"
      >
        <span>Reports</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-chart-line"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
    </ax-side-menu>
  </div>
</div>
