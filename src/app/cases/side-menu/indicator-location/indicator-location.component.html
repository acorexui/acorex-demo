<div class="flex flex-col gap-4">
  <ax-text class="text-sm text-on-surface">
    For <code>with-line</code>, place the active indicator at
    <code>start</code> or <code>end</code>. Set <code>[location]</code> on
    <code>ax-side-menu</code> with <code>look="with-line"</code>.
  </ax-text>

  <div class="flex flex-col gap-4 lg:flex-row lg:items-start">
    <div
      class="w-60 shrink-0 rounded-md bg-primary-surface p-2 text-primary-on-surface"
    >
      <ax-side-menu look="with-line" [location]="selectedLocation()">
        <ax-side-menu-item [active]="true">
          <span>Dashboard</span>
          <ax-prefix>
            <ax-icon>
              <i class="fa-solid fa-gauge-simple"></i>
            </ax-icon>
          </ax-prefix>
        </ax-side-menu-item>
        <ax-side-menu-item [isCollapsed]="false">
          <span>Users</span>
          <ax-prefix>
            <ax-icon>
              <i class="fa-solid fa-user-group"></i>
            </ax-icon>
          </ax-prefix>
          <ax-side-menu-item text="List of users"></ax-side-menu-item>
          <ax-side-menu-item text="Verified users"></ax-side-menu-item>
          <ax-side-menu-item text="Unverified users"></ax-side-menu-item>
        </ax-side-menu-item>
        <ax-side-menu-item>
          <span>Reports</span>
          <ax-prefix>
            <ax-icon>
              <i class="fa-solid fa-chart-line"></i>
            </ax-icon>
          </ax-prefix>
        </ax-side-menu-item>
      </ax-side-menu>
    </div>

    <div class="flex flex-col gap-2">
      <span class="text-sm font-medium">Indicator location</span>
      <ax-button-group [selection]="selection">
        @for (item of locations; track item.value) {
          <ax-button-group-item
            [text]="item.text"
            [selected]="selectedLocation() === item.value"
            (onClick)="setLocation(item.value)"
          ></ax-button-group-item>
        }
      </ax-button-group>
      <ax-text class="text-xs text-on-surface opacity-70">
        Current: <code>{{ selectedLocation() }}</code> — watch the bar on
        Dashboard and the nested guide under Users.
      </ax-text>
    </div>
  </div>
</div>
