<div class="flex flex-col gap-4">
  <div class="flex flex-wrap gap-2">
    <ax-button
      text="Toggle disabled"
      (click)="disabled.set(!disabled())"
    ></ax-button>
    <ax-button
      text="Toggle loading"
      (click)="isLoading.set(!isLoading())"
    ></ax-button>
  </div>

  <div class="w-60 rounded-md bg-primary-surface p-2 text-primary-on-surface">
    <ax-side-menu>
      <ax-side-menu-item
        [active]="menu.isActive('dashboard')"
        (onClick)="menu.select('dashboard', $event)"
      >
        <span>Dashboard</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-gauge-simple"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
      <ax-side-menu-item
        [disabled]="disabled()"
        [active]="menu.isActive('users')"
        (onClick)="menu.select('users', $event)"
      >
        <span>Users (disabled)</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-user-group"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
      <ax-side-menu-item
        [isLoading]="isLoading()"
        [active]="menu.isActive('sync')"
        (onClick)="menu.select('sync', $event)"
      >
        <span>Syncing data</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-rotate"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
      <ax-side-menu-item
        [isLoading]="isLoading()"
        [disabled]="disabled()"
        [active]="menu.isActive('loading-disabled')"
        (onClick)="menu.select('loading-disabled', $event)"
      >
        <span>Loading + disabled</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-spinner"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
    </ax-side-menu>
  </div>
</div>
