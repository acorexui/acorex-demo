<div class="flex flex-col gap-4">
  <ax-text class="text-sm text-on-surface">
    Set <code>[toggleOnClick]="false"</code> when expansion should be controlled
    externally.
  </ax-text>

  <ax-button
    [text]="usersExpanded() ? 'Collapse Users' : 'Expand Users'"
    (click)="toggleUsers()"
  ></ax-button>

  <div
    class="w-60 rounded-md bg-primary-surface p-2 text-primary-on-surface"
  >
    <ax-side-menu>
      <ax-side-menu-item
        [active]="menu.isActive('dashboard')"
        (onClick)="menu.select('dashboard', $event)"
      >
        <span>Dashboard</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-gauge-simple"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
      <ax-side-menu-item
        [toggleOnClick]="false"
        [isCollapsed]="!usersExpanded()"
        [active]="menu.isActive('users')"
        (onClick)="menu.select('users', $event)"
      >
        <span>Users</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-user-group"></i>
          </ax-icon>
        </ax-prefix>
        <ax-side-menu-item
          text="List of users"
          [active]="menu.isActive('users-list')"
          (onClick)="menu.select('users-list', $event)"
        ></ax-side-menu-item>
        <ax-side-menu-item
          text="Verified users"
          [active]="menu.isActive('users-verified')"
          (onClick)="menu.select('users-verified', $event)"
        ></ax-side-menu-item>
        <ax-side-menu-item
          text="Unverified users"
          [active]="menu.isActive('users-unverified')"
          (onClick)="menu.select('users-unverified', $event)"
        ></ax-side-menu-item>
      </ax-side-menu-item>
      <ax-side-menu-item
        [active]="menu.isActive('reports')"
        (onClick)="menu.select('reports', $event)"
      >
        <span>Reports (click toggles)</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-chart-line"></i>
          </ax-icon>
        </ax-prefix>
        <ax-side-menu-item
          text="Monthly"
          [active]="menu.isActive('reports-monthly')"
          (onClick)="menu.select('reports-monthly', $event)"
        ></ax-side-menu-item>
        <ax-side-menu-item
          text="Yearly"
          [active]="menu.isActive('reports-yearly')"
          (onClick)="menu.select('reports-yearly', $event)"
        ></ax-side-menu-item>
      </ax-side-menu-item>
    </ax-side-menu>
  </div>
</div>
