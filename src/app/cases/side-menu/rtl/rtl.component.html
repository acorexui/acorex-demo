<div class="flex flex-col gap-4">
  <div dir="rtl">
    <div class="w-60 rounded-md bg-primary-surface p-2 text-primary-on-surface">
      <ax-side-menu look="with-line">
        <ax-side-menu-item
          [active]="menu.isActive('dashboard')"
          (onClick)="menu.select('dashboard', $event)"
        >
          <span>داشبورد</span>
          <ax-prefix>
            <ax-icon>
              <i class="fa-solid fa-gauge-simple"></i>
            </ax-icon>
          </ax-prefix>
        </ax-side-menu-item>
        <ax-side-menu-item
          [isCollapsed]="false"
          [active]="menu.isActive('users')"
          (onClick)="menu.select('users', $event)"
        >
          <span>کاربران</span>
          <ax-prefix>
            <ax-icon>
              <i class="fa-solid fa-user-group"></i>
            </ax-icon>
          </ax-prefix>
          <ax-side-menu-item
            text="فهرست کاربران"
            [active]="menu.isActive('users-list')"
            (onClick)="menu.select('users-list', $event)"
          ></ax-side-menu-item>
          <ax-side-menu-item
            text="کاربران تأیید‌شده"
            [active]="menu.isActive('users-verified')"
            (onClick)="menu.select('users-verified', $event)"
          ></ax-side-menu-item>
          <ax-side-menu-item
            text="کاربران تأیید‌نشده"
            [active]="menu.isActive('users-unverified')"
            (onClick)="menu.select('users-unverified', $event)"
          ></ax-side-menu-item>
        </ax-side-menu-item>
        <ax-side-menu-item
          [active]="menu.isActive('reports')"
          (onClick)="menu.select('reports', $event)"
        >
          <span>گزارش‌ها</span>
          <ax-prefix>
            <ax-icon>
              <i class="fa-solid fa-chart-line"></i>
            </ax-icon>
          </ax-prefix>
        </ax-side-menu-item>
      </ax-side-menu>
    </div>
  </div>
</div>
