<div class="flex gap-2">
  <div class="w-60 rounded-md p-2">
    <ax-side-menu>
      <ax-side-menu-item
        color="primary"
        [active]="primaryMenu.isActive('dashboard')"
        (onClick)="primaryMenu.select('dashboard', $event)"
      >
        <span>Dashboard</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-gauge-simple"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
      <ax-side-menu-item
        [active]="primaryMenu.isActive('users')"
        (onClick)="primaryMenu.select('users', $event)"
      >
        <span>Users</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-user-group"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
      <ax-side-menu-item
        [isCollapsed]="true"
        [active]="primaryMenu.isActive('comments')"
        (onClick)="primaryMenu.select('comments', $event)"
      >
        <span>Comments</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-comments"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
    </ax-side-menu>
  </div>
  <div class="w-60 rounded-md p-2">

      <ax-side-menu-item
        [isCollapsed]="true"

  </div>
</div>
