      <ax-side-menu-item routerLink="/side-menu/usage" [active]="true">
        <span>Usage (in-app)</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-house"></i>
          </ax-icon>
        </ax-prefix>

      <ax-side-menu-item routerLink="/side-menu/dividers">
        <span>Dividers (in-app)</span>

        </ax-prefix>

      <ax-side-menu-item href="https://angular.dev/" target="_blank">
        <span>Angular docs</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
