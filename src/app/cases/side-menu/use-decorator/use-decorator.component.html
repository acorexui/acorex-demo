<div
  class="w-60 rounded-md bg-primary-surface p-2 text-primary-on-surface"
>
  <ax-side-menu>
    <ax-side-menu-item
      [isCollapsed]="true"
      [disabled]="_options.disabled"
      [active]="menu.isActive('comments')"
      (onClick)="menu.select('comments', $event)"
    >
      <span>Comments</span>
      <ax-prefix>
        <ax-icon>
          <i class="fa-solid fa-comments"></i>
        </ax-icon>
      </ax-prefix>
      <ax-suffix>
        <ax-badge text="+3" color="danger"></ax-badge>
      </ax-suffix>
      <ax-side-menu-item
        [active]="menu.isActive('comments-all')"
        (onClick)="menu.select('comments-all', $event)"
      >
        <span>All Comments</span>
      </ax-side-menu-item>
      <ax-side-menu-item
        [active]="menu.isActive('comments-approved')"
        (onClick)="menu.select('comments-approved', $event)"
      >
        <span>Comments approved</span>
      </ax-side-menu-item>
      <ax-side-menu-item
        [active]="menu.isActive('comments-unverified')"
        (onClick)="menu.select('comments-unverified', $event)"
      >
        <span>Unverified comments</span>
      </ax-side-menu-item>
    </ax-side-menu-item>
  </ax-side-menu>
</div>
