<div class="flex flex-col gap-4">
  <div class="flex flex-wrap gap-2">
    <ax-button
      text="Toggle Users"
      (click)="usersCollapsed.set(!usersCollapsed())"
    ></ax-button>
    <ax-button
      text="Toggle Comments"
      (click)="commentsCollapsed.set(!commentsCollapsed())"
    ></ax-button>
  </div>

  <div class="w-60 rounded-md bg-primary-surface p-2 text-primary-on-surface">
    <ax-side-menu>
      <ax-side-menu-item
        [active]="menu.isActive('dashboard')"
        (onClick)="menu.select('dashboard', $event)"
      >
        <span>Dashboard</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-gauge-simple"></i>
          </ax-icon>
        </ax-prefix>
      </ax-side-menu-item>
      <ax-side-menu-item
        [isCollapsed]="usersCollapsed()"
        [active]="menu.isActive('users')"
        (onClick)="menu.select('users', $event)"
      >
        <span>Users</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-user-group"></i>
          </ax-icon>
        </ax-prefix>
        <ax-side-menu-item
          [active]="menu.isActive('users-list')"
          (onClick)="menu.select('users-list', $event)"
        >
          <span>List of users</span>
        </ax-side-menu-item>
        <ax-side-menu-item
          [active]="menu.isActive('users-verified')"
          (onClick)="menu.select('users-verified', $event)"
        >
          <span>Verified users</span>
        </ax-side-menu-item>
        <ax-side-menu-item
          [active]="menu.isActive('users-unverified')"
          (onClick)="menu.select('users-unverified', $event)"
        >
          <span>Unverified users</span>
        </ax-side-menu-item>
      </ax-side-menu-item>
      <ax-side-menu-item
        [isCollapsed]="commentsCollapsed()"
        [active]="menu.isActive('comments')"
        (onClick)="menu.select('comments', $event)"
      >
        <span>Comments</span>
        <ax-prefix>
          <ax-icon>
            <i class="fa-solid fa-comments"></i>
          </ax-icon>
        </ax-prefix>
        <ax-side-menu-item
          text="All comments"
          [active]="menu.isActive('comments-all')"
          (onClick)="menu.select('comments-all', $event)"
        ></ax-side-menu-item>
        <ax-side-menu-item
          text="Awaiting review"
          [active]="menu.isActive('comments-review')"
          (onClick)="menu.select('comments-review', $event)"
        ></ax-side-menu-item>
      </ax-side-menu-item>
    </ax-side-menu>
  </div>
</div>
