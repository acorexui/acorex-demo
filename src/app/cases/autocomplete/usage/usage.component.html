<div class="flex flex-col items-center justify-center gap-2 min-w-[30rem]">
  <ax-tag-box
    [addOnComma]="false"
    [(ngModel)]="tagBoxValue"
    [allowDuplicateValues]="true"
    placeholder="Enter your tags..."
    (onValueChanged)="handleValueChange($event)"
  >
    <ax-autocomplete [dataSource]="data()"></ax-autocomplete>
  </ax-tag-box>
  <div class="text-xs text-muted">Try typing: Ali, Hasan, Reza</div>
</div>
