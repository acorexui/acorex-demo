<div class="flex w-52 flex-col items-stretch gap-4 py-6">
  @for (color of [currentColor()]; track color) {
    <div class="flex justify-center">
      <ax-badge [color]="color" [text]="badgeText()" look="solid"></ax-badge>
    </div>
  }

  <ax-select-box
    textField="text"
    valueField="value"
    placeholder="Choose color..."
    [(ngModel)]="currentColor"
    [dataSource]="dataSource()"
  ></ax-select-box>
</div>
