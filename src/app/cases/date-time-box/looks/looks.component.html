<div
  class="flex flex-col items-center justify-center gap-6 py-8"
>
  <div class="w-72">
    <ax-form-field>
      <ax-label>Meeting date and time</ax-label>
      <ax-datetime-box
        [look]="currentLook()"
        placeholder="Select the meeting date and time"
      >
        <ax-clear-button></ax-clear-button>
      </ax-datetime-box>
    </ax-form-field>
  </div>

  <div class="flex flex-wrap gap-2 justify-center">
    @for (look of looks; track look.value) {
    <ax-button
      class="ax-sm"
      [text]="look.label"
      (click)="setLook(look.value)"
      [look]="currentLook() === look.value ? 'solid' : 'outline'"
    ></ax-button>
    }
  </div>
</div>
