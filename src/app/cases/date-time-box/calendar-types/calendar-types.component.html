<div
  class="flex flex-col items-center justify-center gap-6 py-8"
>
  <div class="w-72">
    <ax-form-field>
      <ax-label>Meeting date and time</ax-label>
      @switch (currentCalendar()) {
        @case ('gregorian') {
          <ax-datetime-box
            [ngModel]="value()"
            (ngModelChange)="value.set($event)"
            [allowTyping]="true"
            calendar="gregorian"
            placeholder="Select the meeting date and time"
          >
            <ax-clear-button></ax-clear-button>
          </ax-datetime-box>
        }
        @case ('solar-hijri') {
          <ax-datetime-box
            [ngModel]="value()"
            (ngModelChange)="value.set($event)"
            [allowTyping]="true"
            calendar="solar-hijri"
            placeholder="Select the meeting date and time"
          >
            <ax-clear-button></ax-clear-button>
          </ax-datetime-box>
        }
      }
    </ax-form-field>

    <ax-subtitle>
      @if (currentCalendar() === 'solar-hijri') {
        Solar Hijri short format is day/month/year by default.
      } @else {
        Gregorian short format follows the active locale profile.
      }
    </ax-subtitle>
  </div>

  <div class="flex flex-wrap gap-2 justify-center">
    <ax-button
      class="ax-sm"
      text="Gregorian"
      (onClick)="setCalendar('gregorian')"
      [look]="currentCalendar() === 'gregorian' ? 'solid' : 'outline'"
    ></ax-button>
    <ax-button
      class="ax-sm"
      text="Solar Hijri"
      (onClick)="setCalendar('solar-hijri')"
      [look]="currentCalendar() === 'solar-hijri' ? 'solid' : 'outline'"
    ></ax-button>
  </div>
</div>
