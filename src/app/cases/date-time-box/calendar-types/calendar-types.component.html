<div
  class="flex flex-col items-center justify-center gap-6 py-8"
>
  <div class="w-72">
    <ax-form-field>
      <ax-label>Meeting date and time</ax-label>
      <ax-datetime-box
        [allowTyping]="true"
        [calendar]="currentCalendar()"
        placeholder="Select the meeting date and time"
      >
        <ax-clear-button></ax-clear-button>
      </ax-datetime-box>
    </ax-form-field>

    <ax-subtitle>
      @if (currentCalendar() === 'solar-hijri') {
        Solar Hijri short format is day/month/year by default.
      } @else {
        Gregorian short format follows the active locale profile.
      }
    </ax-subtitle>
  </div>

  <div class="flex flex-wrap gap-2 justify-center">
    @for (calendar of calendars; track calendar.value) {
      <ax-button
        class="ax-sm"
        [text]="calendar.label"
        (onClick)="setCalendar(calendar.value)"
        [look]="currentCalendar() === calendar.value ? 'solid' : 'outline'"
      ></ax-button>
    }
  </div>
</div>
