<div class="flex flex-col items-center justify-center gap-6 py-8">
  <div class="flex w-72 flex-col gap-4">
    <ax-form-field>
      <ax-label>Meeting date and time</ax-label>
      <ax-datetime-box
        [ngModel]="value()"
        (ngModelChange)="value.set($event)"
        [allowTyping]="allowTyping()"
        placeholder="Select or type a date and time"
      >
        <ax-clear-button></ax-clear-button>
      </ax-datetime-box>
    </ax-form-field>

    <ax-button
      (onClick)="toggleAllowTyping()"
      [look]="allowTyping() ? 'solid' : 'outline'"
      [text]="allowTyping() ? 'Disable typing' : 'Enable typing'"
    ></ax-button>
  </div>
</div>
