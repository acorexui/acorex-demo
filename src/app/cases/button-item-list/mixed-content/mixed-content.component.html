<div
  class="flex flex-col items-center justify-center gap-4 p-4"
>
  <div class="w-64">
    <ax-button-item-list
      [items]="items()"
      (onItemClick)="handleItemClick($event)"
      class="rounded-lg border border-surface"
    >
      <!-- Content projection items -->
      <ax-button-item
        text="Custom Item 1"
        name="custom1"
        color="primary"
        (onClick)="handleClick($event)"
      >
        <ax-prefix>
          <ax-icon icon="fa-solid fa-star"></ax-icon>
        </ax-prefix>
      </ax-button-item>

      <ax-button-item
        text="Custom Item 2"
        name="custom2"
        color="success"
        [divided]="true"
        (onClick)="handleClick($event)"
      >
        <ax-prefix>
          <ax-icon icon="fa-solid fa-heart"></ax-icon>
        </ax-prefix>
      </ax-button-item>
    </ax-button-item-list>
  </div>
</div>
