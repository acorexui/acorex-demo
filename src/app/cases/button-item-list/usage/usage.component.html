<div
  class="flex flex-col items-center justify-center gap-4 p-4"
>
  <div class="w-64">
    <ax-button-item-list
      (onItemClick)="handleItemClick($event)"
      class="rounded-lg border border-surface"
    >
      <ax-button-item
        text="First Item"
        name="item1"
        (onClick)="handleClick($event)"
      >
        <ax-prefix>
          <ax-icon icon="fa-solid fa-home"></ax-icon>
        </ax-prefix>
      </ax-button-item>

      <ax-button-item
        text="Second Item"
        name="item2"
        (onClick)="handleClick($event)"
      >
        <ax-prefix>
          <ax-icon icon="fa-solid fa-user"></ax-icon>
        </ax-prefix>
      </ax-button-item>

      <ax-button-item
        text="Third Item"
        name="item3"
        (onClick)="handleClick($event)"
      >
        <ax-prefix>
          <ax-icon icon="fa-solid fa-cog"></ax-icon>
        </ax-prefix>
      </ax-button-item>
    </ax-button-item-list>
  </div>

  <div class="mt-4 text-sm">
    <p>Last clicked: {{ lastClicked() || "None" }}</p>
    <p>Item name: {{ lastItemName() || "None" }}</p>
  </div>
</div>
