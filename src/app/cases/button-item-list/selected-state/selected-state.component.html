<div class="flex flex-col items-center justify-center gap-4 p-4">
  <h3 class="text-lg font-semibold">Button Item List Selected State</h3>

  <div class="w-64">
    <ax-button-item-list
      [items]="items()"
      (onItemClick)="handleItemClick($event)"
      class="rounded-lg border border-surface"
    >
    </ax-button-item-list>
  </div>

  <div class="mt-4 text-sm">
    <p>Selected option: {{ selectedOption() || 'None' }}</p>
    <p>Last clicked: {{ lastClicked() || 'None' }}</p>
    <p>Item name: {{ lastItemName() || 'None' }}</p>
  </div>
</div>
