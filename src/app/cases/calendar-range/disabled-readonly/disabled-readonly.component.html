<div class="flex flex-col items-center justify-center gap-2 px-4">
  <div class="flex flex-wrap gap-2 items-center justify-center">
    <ax-button
      [text]="'Toggle Disabled'"
      [class.state-selected]="disabled()"
      (click)="disabled.set(!disabled())"
    ></ax-button>
    <ax-button
      [text]="'Toggle Readonly'"
      [class.state-selected]="readOnly()"
      (click)="readOnly.set(!readOnly())"
    ></ax-button>
  </div>

  <small class="text-center text-neutral-500">
    Selected:
    {{
      selectedRange().from ? selectedRange().from!.toDateString() : 'None'
    }}
    —
    {{ selectedRange().end ? selectedRange().end!.toDateString() : 'None' }}
  </small>

  <ax-calendar-range
    [disabled]="disabled()"
    [readonly]="readOnly()"
    [value]="selectedRange()"
    (onValueChanged)="onRangeChanged($event)"
  ></ax-calendar-range>

  @if (readOnly()) {
    <small class="text-center text-neutral-500 max-w-md">
      Range is read-only: clicks do not update the selection above.
    </small>
  }
</div>
