<div
  class="flex flex-col items-center justify-center gap-2 px-4"
>
  <div class="flex gap-2 items-center">
    <ax-label>Min:</ax-label>
    <ax-datetime-box
      [value]="min()"
      (onValueChanged)="min.set($event.value)"
    ></ax-datetime-box>
    <ax-label>Max:</ax-label>
    <ax-datetime-box
      [value]="max()"
      (onValueChanged)="max.set($event.value)"
    ></ax-datetime-box>
  </div>
  <ax-calendar-range [minValue]="min()" [maxValue]="max()"></ax-calendar-range>
</div>
