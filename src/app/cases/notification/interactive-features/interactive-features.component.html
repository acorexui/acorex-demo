<div
  class="flex flex-col items-center justify-center gap-4 p-4"
>
  <div class="flex flex-wrap gap-2 justify-center">
    <ax-button
      color="primary"
      text="Programmatic Control"
      (onClick)="showProgrammaticControl()"
    >
    </ax-button>

    <ax-button
      color="success"
      text="Dynamic Buttons"
      (onClick)="showDynamicButtons()"
    >
    </ax-button>

    <ax-button
      color="warning"
      text="Loading Buttons"
      (onClick)="showLoadingButtons()"
    >
    </ax-button>

    <ax-button text="Multi-Step Process" (onClick)="showMultiStepProcess()">
    </ax-button>

    <ax-button
      color="danger"
      text="Hide All Notifications"
      (onClick)="showHideAll()"
    >
    </ax-button>

    <ax-button
      color="secondary"
      text="Custom Icon"
      (onClick)="showNotificationWithCustomIcon()"
    >
    </ax-button>
  </div>
</div>
