<div class="flex flex-col items-center justify-center gap-4 p-4">
  <ax-select-box
    class="w-56"
    [dataSource]="locationOptions"
    textField="text"
    valueField="value"
    [(ngModel)]="selectedLocation"
  ></ax-select-box>

  <ax-button
    [color]="selectedButtonColor()"
    [text]="selectedButtonText()"
    (onClick)="showSelected()"
  ></ax-button>
</div>
