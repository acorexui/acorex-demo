<div class="flex flex-col items-center justify-center gap-4 p-4">
  <ax-select-box
    class="w-52"
    [dataSource]="typeOptions"
    textField="text"
    valueField="value"
    [(ngModel)]="selectedType"
  ></ax-select-box>

  <ax-button
    [color]="selectedType()"
    [text]="selectedButtonText()"
    (onClick)="showNotification()"
  ></ax-button>
</div>
