<div
  class="flex flex-col items-center justify-center gap-4 p-4"
>
  <div class="flex flex-wrap gap-2 justify-center">
    <ax-button
      color="primary"
      text="Template Content"
      (onClick)="showTemplateNotification()"
    >
    </ax-button>

    <ax-button
      color="success"
      text="Component Content"
      (onClick)="showComponentNotification()"
    >
    </ax-button>

    <ax-button
      color="warning"
      text="Rich HTML Content"
      (onClick)="showRichContentNotification()"
    >
    </ax-button>
  </div>
</div>
