<div class="flex flex-col gap-8 p-8">
  <div class="w-[400px] h-[250px] p-4">
    <ax-line-chart
      (pointClick)="handleLineChartPointClick($event)"
      [data]="lineChartData()"
      [options]="smallChartOptions()"
    ></ax-line-chart>
  </div>

  <div class="w-[600px] h-[350px] p-4">
    <ax-line-chart
      (pointClick)="handleLineChartPointClick($event)"
      [data]="lineChartData()"
      [options]="mediumChartOptions()"
    ></ax-line-chart>
  </div>
</div>
