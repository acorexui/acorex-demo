<div class="h-[500px] w-[800px]">
  <ax-hierarchy-chart
    [data]="hierarchyChartData()"
    [options]="hierarchyChartOptions()"
    (itemClick)="handleHierarchyChartNodeClick($event)"
  >
    <ng-template #nodeTemplate let-node>
      <div
        class="h-full rounded-md border p-3 shadow-sm"
        [class.border-primary-200]="node.expanded"
        [class.border-danger-200]="!node.expanded"
        [class.bg-white]="true"
      >
        <div class="flex h-full flex-col gap-1">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div
                class="flex h-6 w-6 flex-none items-center justify-center rounded-full bg-primary-100"
              >
                <i
                  class="fa-solid text-xs text-primary-500"
                  [class.fa-user-tie]="node.type === 'CEO'"
                  [class.fa-user-gear]="
                    node.type === 'CTO' || node.type === 'CFO'
                  "
                  [class.fa-user]="
                    node.type !== 'CEO' &&
                    node.type !== 'CTO' &&
                    node.type !== 'CFO'
                  "
                ></i>
              </div>
              <div class="truncate font-medium text-gray-800">
                {{ node.name || node.label }}
              </div>
            </div>

            @if(node.children && node.children.length) {
            <button
              (click)="node.toggleExpanded()"
              class="flex h-5 w-5 items-center justify-center rounded border border-gray-200 text-xs text-gray-500"
            >
              <i
                class="fa-solid"
                [class.fa-chevron-up]="node.expanded"
                [class.fa-chevron-down]="!node.expanded"
              ></i>
            </button>
            }
          </div>

          @if(node.subtitle) {
          <div class="mt-1 text-xs text-gray-500">
            {{ node.subtitle }}
          </div>
          }
        </div>
      </div>
    </ng-template>
  </ax-hierarchy-chart>
</div>
