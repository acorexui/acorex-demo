<div
  class="flex flex-col items-center justify-center gap-6 p-4"
>
  <!-- Theme Colors -->
  <div class="flex flex-col items-center gap-4">
    <h3 class="text-lg font-medium">Theme Colors</h3>
    <div class="flex items-center justify-center gap-6">
      <div class="flex flex-col items-center gap-2">
        <ax-loading-spinner [size]="24" color="default"></ax-loading-spinner>
        <span class="text-sm">Default</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <ax-loading-spinner [size]="24" color="primary"></ax-loading-spinner>
        <span class="text-sm">Primary</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <ax-loading-spinner [size]="24" color="secondary"></ax-loading-spinner>
        <span class="text-sm">Secondary</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <ax-loading-spinner [size]="24" color="success"></ax-loading-spinner>
        <span class="text-sm">Success</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <ax-loading-spinner [size]="24" color="warning"></ax-loading-spinner>
        <span class="text-sm">Warning</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <ax-loading-spinner [size]="24" color="danger"></ax-loading-spinner>
        <span class="text-sm">Danger</span>
      </div>
    </div>
  </div>

  <!-- Contrast Colors -->
  <div class="flex flex-col items-center gap-4">
    <h3 class="text-lg font-medium">Contrast Colors</h3>
    <div class="flex items-center justify-center gap-8">
      <div class="flex flex-col items-center gap-2">
        <div class="bg-gray-800 p-4 rounded">
          <ax-loading-spinner [size]="24" color="white"></ax-loading-spinner>
        </div>
        <span class="text-sm">White</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="bg-gray-200 p-4 rounded">
          <ax-loading-spinner [size]="24" color="black"></ax-loading-spinner>
        </div>
        <span class="text-sm">Black</span>
      </div>
    </div>
  </div>
</div>
