<div class="flex flex-col gap-3">
  <ax-button text="Toggle" color="primary" (onClick)="toggle()"></ax-button>

  <div
    class="h-48 border rounded p-4 relative"
    [axIsLoading]="isLoading"
  >
    <div>This is content inside the container.</div>
    <section class="mt-2">
      Overlay should cover this section when loading is true.
    </section>
  </div>
</div>
