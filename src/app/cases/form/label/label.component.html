<div class="flex w-80 flex-col items-stretch gap-4">
  @for (mode of [labelMode()]; track mode) {
    <ax-form [labelMode]="mode">
      <div class="flex w-full flex-row gap-4">
        <ax-form-field class="flex-1">
          <ax-label>First name</ax-label>
          <ax-text-box name="firstname" placeholder="First name"></ax-text-box>
        </ax-form-field>
        <ax-form-field class="flex-1">
          <ax-label>Last name</ax-label>
          <ax-text-box name="lastname" placeholder="Last name"></ax-text-box>
        </ax-form-field>
      </div>
    </ax-form>
  }

  <ax-form labelMode="static">
    <ax-form-field>
      <ax-label>Label mode</ax-label>
      <ax-select-box
        textField="text"
        valueField="value"
        placeholder="Choose label mode..."
        [(ngModel)]="labelMode"
        [dataSource]="labelModeOptions()"
      ></ax-select-box>
    </ax-form-field>
  </ax-form>
</div>
