<ax-form #form1 [updateOn]="'change'" [messageStyle]="'float'">
  <div class="flex w-80 flex-col justify-center gap-4 py-10">
    <div class="flex w-full flex-row gap-4">
      <ax-form-field class="flex-1">
        <ax-label>Firstname</ax-label>
        <ax-text-box name="firstname">
          <ax-validation-rule rule="required"> </ax-validation-rule>
        </ax-text-box>
      </ax-form-field>
      <ax-form-field class="flex-1">
        <ax-label>Lastname</ax-label>
        <ax-text-box name="lastname">
          <ax-validation-rule rule="required"> </ax-validation-rule>
        </ax-text-box>
      </ax-form-field>
    </div>
    <ax-form-field>
      <ax-label>Email</ax-label>
      <ax-text-box name="Email">
        <ax-validation-rule rule="required"> </ax-validation-rule>
        <ax-validation-rule rule="custom" value="email"> </ax-validation-rule>
      </ax-text-box>
    </ax-form-field>
    <ax-validation-summary
      [displayMode]="'toast'"
      [autoHide]="true"
    ></ax-validation-summary>
    <div class="flex w-full flex-row gap-4">
      <ax-button
        class="flex-1"
        [type]="'submit'"
        text="Submit"
        color="primary"
      >
      </ax-button>
      <ax-button
        class="flex-1"
        [type]="'reset'"
        text="Clear"
        color="danger"
        [look]="'outline'"
      >
      </ax-button>
    </div>
  </div>
</ax-form>
