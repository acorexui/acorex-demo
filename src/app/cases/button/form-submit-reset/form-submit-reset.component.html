<div class="flex flex-col gap-3 w-full md:w-2/3 px-4">
  <form
    (submit)="onSubmit($event)"
    (reset)="onReset()"
    class="flex items-center gap-2"
  >
    <ax-button
      [type]="'submit'"
      look="solid"
      color="primary"
      text="Submit"
    ></ax-button>
    <ax-button
      [type]="'reset'"
      look="outline"
      color="primary"
      text="Reset"
    ></ax-button>
    <ax-button
      [type]="'button'"
      look="link"
      color="default"
      text="No-op Button"
    ></ax-button>
  </form>
  <div class="text-sm opacity-70">{{ message }}</div>
</div>
