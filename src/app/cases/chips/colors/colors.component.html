<div class="flex w-52 flex-col items-stretch gap-4">
  @for (color of [currentColor()]; track color) {
    <div class="flex justify-center">
      <ax-chips
        [text]="chipText()"
        [color]="color"
        look="solid"
        class="w-fit"
      ></ax-chips>
    </div>
  }

  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentColor"
    [dataSource]="dataSource()"
  ></ax-select-box>
</div>
