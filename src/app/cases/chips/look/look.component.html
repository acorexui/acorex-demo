<div class="flex w-52 flex-col items-stretch gap-4">
  @for (look of [currentLook()]; track look) {
    <div class="flex justify-center">
      <ax-chips
        [text]="chipText()"
        color="primary"
        [look]="look"
        class="w-fit"
      ></ax-chips>
    </div>
  }

  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentLook"
    [dataSource]="dataSource()"
  ></ax-select-box>
</div>
