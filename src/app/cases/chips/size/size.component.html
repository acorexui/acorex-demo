<div class="flex w-52 flex-col items-stretch gap-4">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentSize"
    [dataSource]="dataSource()"
  ></ax-select-box>

  @for (size of [currentSize()]; track size) {
    <div class="flex justify-center">
      <ax-chips
        [text]="chipText()"
        color="primary"
        [class]="size + ' w-fit'"
      ></ax-chips>
    </div>
  }
</div>
