<div class="flex flex-row items-center justify-center gap-4">
  <div class="flex flex-col items-center">
    <ax-label>Calendar Type</ax-label>
    <ax-select-box
      [dataSource]="calendarTypes"
      [(ngModel)]="currentCalendarType"
    ></ax-select-box>
  </div>

  <ax-datetime-picker
    [ngModel]="selectedValue()"
    placeholder="Select date/time"
    [calendar]="currentCalendarType()"
    (onValueChanged)="selectedValue.set($event.value)"
  ></ax-datetime-picker>
</div>
