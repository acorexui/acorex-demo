<!--
  multi-select: default popup header with "Select all" + ax-check-box
  (no projected ax-header). Select all → { selectAll: true }; excluded keys while active;
  uncheck select all → [] or remaining plain array. Select-all mode hides trigger chips.
-->

<div class="flex w-full max-w-md flex-col gap-8">
  <section class="flex flex-col gap-2">
    <ax-label>Multi-select</ax-label>
    <ax-lookup
      mode="multi-select"
      [dataSource]="countries"
      valueField="id"
      textField="name"
      placeholder="Select countries..."
      [(value)]="multiValue"
    >
      <ax-clear-button></ax-clear-button>
    </ax-lookup>

    <p class="text-xs opacity-70">
      Bound value:

      <code class="break-all">{{ multiValue() | json }}</code>
    </p>
  </section>
</div>
