<div class="ax-w-80 ax-py-8">
  <ax-form-field>
    <ax-label>Appointment</ax-label>
    <ax-datetime-text-box format="yyyy/MM/dd HH:mm" placeholder="yyyy/MM/dd HH:mm">
      <ax-prefix>
        <ax-icon icon="fa-regular fa-calendar"></ax-icon>
      </ax-prefix>
      <ax-suffix>
        <ax-button color="secondary" text="Now"></ax-button>
      </ax-suffix>
      <ax-clear-button></ax-clear-button>
    </ax-datetime-text-box>
  </ax-form-field>
</div>
