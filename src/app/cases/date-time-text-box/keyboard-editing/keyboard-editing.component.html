<div class="ax-flex ax-flex-col ax-items-center ax-justify-center ax-gap-4 ax-py-8">
  <div class="ax-w-72">
    <ax-form-field>
      <ax-label>Try keyboard editing</ax-label>
      <ax-datetime-text-box
        [value]="value"
        format="yyyy/MM/dd HH:mm"
        placeholder="yyyy/MM/dd HH:mm"
      >
        <ax-clear-button></ax-clear-button>
      </ax-datetime-text-box>
    </ax-form-field>
  </div>
  <ul class="ax-text-sm ax-text-secondary ax-list-disc ax-ps-5 ax-m-0 ax-max-w-md">
    <li>Type digits to fill the selected segment</li>
    <li>Left / Right arrows move between segments</li>
    <li>Up / Down arrows change the active segment</li>
    <li>Backspace / Delete clears the active segment</li>
    <li>Tab / Space advances to the next segment</li>
  </ul>
</div>
