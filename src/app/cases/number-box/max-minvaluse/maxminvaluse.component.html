<div
  class="flex w-full max-w-2xl flex-col gap-8 py-4 px-4"
>
  <div class="flex flex-col gap-2">
    <ax-title>−20 – 20</ax-title>
    <ax-text> Min and max can be negative or span across zero. </ax-text>
    <ax-number-box
      [ngModel]="valueNegPos()"
      (ngModelChange)="valueNegPos.set($event)"
      [minValue]="-20"
      [maxValue]="20"
      [showSpinButtons]="true"
      [step]="1"
      placeholder="−20 … 20"
    />
  </div>
</div>
