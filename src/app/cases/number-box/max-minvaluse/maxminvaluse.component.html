<div
  class="flex w-full max-w-2xl flex-col gap-8 py-4 px-4"
>
  <div class="flex flex-col gap-2">
    <ax-title>Range across zero</ax-title>
    <ax-text>Values stay between −20 and 20.</ax-text>
    <ax-number-box
      [ngModel]="valueNegPos()"
      (ngModelChange)="valueNegPos.set($event)"
      [minValue]="-20"
      [maxValue]="20"
      [showSpinButtons]="true"
      [step]="1"
      placeholder="−20 … 20"
    />
  </div>
</div>
