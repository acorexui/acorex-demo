<div class="flex flex-col gap-4">
  <ax-text class="text-sm text-on-surface">
    When <code>closeOnBackdropClick</code> is <code>true</code>, clicking
    outside the panel closes the popup.
  </ax-text>

  <div class="flex flex-wrap gap-2">
    <ax-button
      color="primary"
      text="closeOnBackdropClick: true"
      (onClick)="openCloseOnBackdrop()"
    ></ax-button>
    <ax-button
      text="closeOnBackdropClick: false"
      (onClick)="openKeepOpenOnBackdrop()"
    ></ax-button>
  </div>
</div>
