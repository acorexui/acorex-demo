<div class="flex flex-col gap-4">
  <ax-text class="text-sm text-on-surface">
    Use <code>closeOnEscape</code> to control the Escape key. When it is unset,
    Escape follows the close button: it closes the popup only if
    <code>closeButton</code> is shown.
  </ax-text>

  <div class="flex flex-wrap gap-2">
    <ax-button
      color="primary"
      text="closeOnEscape: true"
      (onClick)="openCloseOnEscape()"
    ></ax-button>
    <ax-button
      text="closeOnEscape: false"
      (onClick)="openKeepOpenOnEscape()"
    ></ax-button>
    <ax-button
      text="Legacy — closeButton: true"
      (onClick)="openLegacyEscapeWithCloseButton()"
    ></ax-button>
    <ax-button
      text="Legacy — closeButton: false"
      (onClick)="openLegacyEscapeWithoutCloseButton()"
    ></ax-button>
  </div>
</div>
