<div class="flex flex-col gap-4">
  <ax-text class="text-sm text-on-surface">
    Enable fullscreen maximize with <code>maximizable</code> or
    <code>buttons.maximize</code>.
  </ax-text>

  <div class="flex flex-wrap gap-2">
    <ax-button
      color="primary"
      text="maximizable: true"
      (onClick)="openWithMaximizable()"
    ></ax-button>
    <ax-button
      text="buttons.maximize: true"
      (onClick)="openWithButtonsMaximize()"
    ></ax-button>
  </div>
</div>
