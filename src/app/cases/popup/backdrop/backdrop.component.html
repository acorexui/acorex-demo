<div class="flex flex-col gap-4">
  <div class="flex flex-wrap gap-2">
    <ax-button
      color="primary"
      text="With backdrop"
      (onClick)="openWithBackdrop()"

    <ax-button text="No backdrop" (onClick)="openWithoutBackdrop()"></ax-button>
    <ax-button
      text="Custom backdropClass"
      (onClick)="openWithCustomBackdropClass()"
    ></ax-button>
  </div>
</div>
