<div class="flex flex-col items-center justify-center gap-4 py-10">
  <ax-select-box
    class="w-56"
    [dataSource]="positionOptions"
    textField="text"
    valueField="value"
    [(ngModel)]="selectedPosition"
  ></ax-select-box>

  <ax-button
    color="primary"
    [text]="buttonText()"
    (onClick)="openPopup()"
  ></ax-button>
</div>
