<div class="flex flex-col gap-4">
  <ax-text class="text-sm text-on-surface">
    Enable or disable dragging the popup by the header with
    <code>draggable</code>.
  </ax-text>

  <div class="flex flex-wrap gap-2">
    <ax-button
      color="primary"
      text="draggable: true"
      (onClick)="openDraggable()"
    ></ax-button>
    <ax-button
      text="draggable: false"
      (onClick)="openNotDraggable()"
    ></ax-button>
  </div>
</div>
