<div class="flex flex-col items-center gap-4 py-10">
  <div class="flex w-64 items-center justify-between gap-3">
    <ax-label>Draggable</ax-label>
    <ax-switch
      [value]="draggable()"
      (valueChange)="draggable.set($event)"
    ></ax-switch>
  </div>

  <ax-button
    color="primary"
    text="Open popup"
    (onClick)="openPopup()"
  ></ax-button>
</div>
