<div class="mb-16 overflow-hidden rounded-lg border border-default bg-surface shadow-sm">
  <div class="overflow-x-auto">
    <table class="table-alternate table w-full text-sm">
      <thead>
        <tr class="bg-lightest-surface text-left">
          <th class="px-5 py-3 font-semibold">Size</th>
          <th class="px-5 py-3 font-semibold">Screen</th>
          <th class="px-5 py-3 font-semibold">Width</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track $index) {
          <tr class="transition-colors hover:bg-lightest-surface/60">
            <td class="px-5 py-3 font-medium" data-label="Size">
              {{ row.size }}
            </td>
            <td class="px-5 py-3" data-label="Screen">{{ row.screen }}</td>
            <td class="px-5 py-3" data-label="Width">
              <code class="rounded bg-lightest-surface px-1.5 py-0.5 font-mono text-xs">
                {{ row.width }}
              </code>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
