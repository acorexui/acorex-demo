<div
  class="flex flex-col items-center justify-center gap-4 py-16 text-center"
>
  <div>
    <div class="h4">Copy / Paste</div>
    <p>
      Copy a string of numbers or the code below and then paste it on one of the
      inputs
    </p>
    <pre axTooltip="Click to copy" (click)="handleCopyClick('1234567')">
123456</pre
    >
  </div>
  <div class="w-80">
    <ax-otp [length]="6" look="fill"></ax-otp>
  </div>
</div>
