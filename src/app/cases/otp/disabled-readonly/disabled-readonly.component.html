<div
  class="flex flex-col items-center justify-center gap-6 py-16 text-center"
>
  <div>
    <div class="h4">OTP Disabled & Readonly States</div>
    <p class="text-sm">
      Control the disabled and readonly states of the OTP component
    </p>
  </div>

  <div class="flex flex-col gap-4 items-center">
    <div class="flex items-center gap-3">
      <ax-switch
        [ngModel]="isDisabled()"
        (onValueChanged)="toggleDisabled($event.value)"
      ></ax-switch>
      <span>Disabled</span>
    </div>

    <div class="flex items-center gap-3">
      <ax-switch
        [ngModel]="isReadonly()"
        (onValueChanged)="toggleReadonly($event.value)"
      ></ax-switch>
      <span>Readonly</span>
    </div>
  </div>

  <div class="w-80">
    <ax-otp
      [length]="4"
      [ngModel]="otpValue"
      [disabled]="isDisabled()"
      [readonly]="isReadonly()"
      placeholder="Enter code"
    ></ax-otp>
  </div>

  <div class="text-xs text-muted">
    @if (isDisabled()) {
    <div class="text-warning">Component is disabled</div>
    } @if (isReadonly()) {
    <div class="text-info">Component is readonly</div>
    } @if (!isDisabled() && !isReadonly()) {
    <div class="text-success">Component is interactive</div>
    }
  </div>
</div>
