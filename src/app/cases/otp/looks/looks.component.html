<div
  class="flex flex-col items-center justify-center gap-6 py-16 text-center"
>
  <div>
    <div class="h4">OTP Look Variations</div>
    <p class="text-sm">Different visual styles for the OTP component</p>
  </div>

  <div class="flex flex-wrap justify-center gap-2">
    <ax-button-group>
      @for (look of looks; track look.value) {
      <ax-button-group-item
        class="ax-sm"
        [text]="look.label"
        (onClick)="setLook(look.value)"
        [selected]="selectedLook() === look.value"
      >
      </ax-button-group-item>
      }
    </ax-button-group>
  </div>

  <div class="w-80">
    <ax-otp [length]="4" [look]="selectedLook()"></ax-otp>
  </div>

  <div class="text-xs text-muted">
    Current look: <strong>{{ selectedLook() }}</strong>
  </div>
</div>
