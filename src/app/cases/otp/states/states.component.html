<div
  class="flex flex-col items-center justify-center gap-6 py-16 text-center"
>
  <div>
    <div class="h4">OTP Validation States</div>
    <p class="text-sm">Different validation states for the OTP component</p>
  </div>

  <div class="flex flex-wrap justify-center gap-2">
    <ax-button-group>
      @for (state of states; track state.value) {
      <ax-button-group-item
        class="ax-sm"
        [text]="state.label"
        (onClick)="setState(state.value)"
        [selected]="selectedState() === state.value"
      >
      </ax-button-group-item>
      }
    </ax-button-group>
  </div>

  <div class="w-80">
    <ax-otp
      [length]="4"
      [(ngModel)]="otpValue"
      [state]="selectedState()"
      (onCompleted)="onCompleted($event)"
    ></ax-otp>
  </div>

  <div class="text-xs text-muted">
    Current state: <strong>{{ selectedState() }}</strong>
    @if (otpValue()) {
    <br />Value: <strong>{{ otpValue() }}</strong>
    }
  </div>
</div>
