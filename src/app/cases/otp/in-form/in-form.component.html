<div class="flex items-center justify-center px-6 py-16 sm:py-20">
  <div
    class="w-full max-w-md rounded-2xl border border-default bg-surface p-8 shadow-sm sm:p-10"
  >
    <ax-form
      class="flex flex-col gap-10"
      [messageStyle]="'float'"
      [updateOn]="'submit'"
      (onValidate)="onFormValidated($event)"
    >
      <div class="flex flex-col items-center gap-5 px-2 text-center">
        <div
          class="flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 text-primary"
        >
          <i class="fa-solid fa-shield-halved text-2xl" aria-hidden="true"></i>
        </div>
        <div class="space-y-3">
          <h2 class="text-lg font-semibold text-on-surface">
            Verify your account
          </h2>
          <p class="text-sm leading-relaxed text-muted">
            We sent a 6-digit code to
            <span class="font-medium text-on-surface">you&#64;example.com</span>.
            Enter it below to continue.
          </p>
        </div>
      </div>

      <ax-form-field class="flex flex-col gap-4 px-1">
        <ax-label class="block w-full text-center text-sm font-medium">
          Verification code
        </ax-label>
        <div class="flex w-full justify-center px-2 pt-1">
          <ax-otp
            class="w-full max-w-[19rem]"
            name="verificationCode"
            [(ngModel)]="code"
            [length]="6"
            look="fill"
          >
            <ax-validation-rule
              rule="required"
              message="Verification code is required."
            ></ax-validation-rule>
          </ax-otp>
        </div>
      </ax-form-field>

      <div class="mt-8 flex flex-col gap-5 sm:mt-10">
        <ax-button
          class="w-full"
          type="submit"
          text="Verify and continue"
          color="primary"
        ></ax-button>

        @if (submitMessage()) {
          <p
            class="rounded-lg border px-4 py-3 text-center text-sm leading-relaxed"
            [class.border-success]="submitSuccess() === true"
            [class.text-success]="submitSuccess() === true"
            [class.bg-success/5]="submitSuccess() === true"
            [class.border-danger]="submitSuccess() === false"
            [class.text-danger]="submitSuccess() === false"
            [class.bg-danger/5]="submitSuccess() === false"
          >
            {{ submitMessage() }}
          </p>
        }
      </div>

      <p
        class="border-t border-default pt-8 text-center text-xs leading-relaxed text-muted"
      >
        Didn&apos;t get a code?
        <button
          type="button"
          class="ms-1 font-medium text-primary underline-offset-2 hover:underline"
        >
          Resend email
        </button>
      </p>
    </ax-form>
  </div>
</div>
