<div
    class="flex flex-col items-center justify-center gap-4 py-16 text-center"
>
    <div>
        <div class="h4">One Time Password</div>
        <p class="text-sm">
            Please enter the verification code that was emailed to you
        </p>
    </div>
    <div class="w-80">
        <ax-otp
            [(ngModel)]="otpValue"
            [length]="6"
            look="fill"
            [state]="'success'"
        ></ax-otp>
    </div>
</div>
