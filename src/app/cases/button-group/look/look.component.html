<div class="flex w-52 flex-col items-stretch gap-4">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentLook"
    [dataSource]="dataSource()"
  ></ax-select-box>

  @for (look of [currentLook()]; track look) {
    <ax-button-group color="primary" [look]="look" [selection]="selection">
      <ax-button-group-item text="Start" [selected]="true"></ax-button-group-item>
      <ax-button-group-item text="Middle"></ax-button-group-item>
      <ax-button-group-item text="End"></ax-button-group-item>
    </ax-button-group>
  }
</div>
