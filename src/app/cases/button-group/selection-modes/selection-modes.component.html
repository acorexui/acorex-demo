<div
  class="flex flex-col items-center justify-center gap-4 px-4"
>
  <section class="w-full">
    <h4 class="text-sm mb-2">None (no selection)</h4>
    <ax-button-group
      [selection]="modeNone"
      (onClick)="handleGroupClick($event)"
      (selectedButtonChange)="handleSelectedButtonChange($event)"
    >
      <ax-button-group-item name="bold" text="Bold"></ax-button-group-item>
      <ax-button-group-item name="italic" text="Italic"></ax-button-group-item>
      <ax-button-group-item
        name="underline"
        text="Underline"
      ></ax-button-group-item>
    </ax-button-group>
  </section>

  <section class="w-full">
    <h4 class="text-sm mb-2">Single (with pre-selected)</h4>
    <ax-button-group
      [selection]="modeSingle"
      (onClick)="handleGroupClick($event)"
      (selectedButtonChange)="handleSelectedButtonChange($event)"
    >
      <ax-button-group-item
        name="list"
        text="List"
        [selected]="true"
      ></ax-button-group-item>
      <ax-button-group-item name="grid" text="Grid"></ax-button-group-item>
      <ax-button-group-item
        name="gallery"
        text="Gallery"
      ></ax-button-group-item>
    </ax-button-group>
  </section>

  <section class="w-full">
    <h4 class="text-sm mb-2">Multiple (with pre-selected)</h4>
    <ax-button-group
      [selection]="modeMultiple"
      (onClick)="handleGroupClick($event)"
      (selectedButtonChange)="handleSelectedButtonChange($event)"
    >
      <ax-button-group-item
        name="bold"
        text="Bold"
        [selected]="true"
      ></ax-button-group-item>
      <ax-button-group-item
        name="italic"
        text="Italic"
        [selected]="true"
      ></ax-button-group-item>
      <ax-button-group-item
        name="underline"
        text="Underline"
      ></ax-button-group-item>
    </ax-button-group>
  </section>

  <div class="text-xs text-subtle w-full">
    <div>Last onClick: {{ lastGroupEvent() }}</div>
    <div>Last selectedButtonChange: {{ lastSelectedButton() }}</div>
  </div>
</div>
