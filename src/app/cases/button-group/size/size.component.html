<div class="flex flex-col items-stretch gap-4">
  <ax-select-box
    class="w-52"
    textField="text"
    valueField="value"
    [(ngModel)]="currentSize"
    [dataSource]="dataSource()"
  ></ax-select-box>

  @for (size of [currentSize()]; track size) {
    <ax-button-group color="primary" [selection]="selection" [class]="size">
      <ax-button-group-item text="Start" [selected]="true"></ax-button-group-item>
      <ax-button-group-item text="Middle"></ax-button-group-item>
      <ax-button-group-item text="End"></ax-button-group-item>
    </ax-button-group>
  }
</div>
