<div class="flex flex-col gap-4 p-4">
  <div class="flex items-center gap-4">
    <ax-title>Responsive Demo</ax-title>
    <ax-subtitle>Test scheduler in different container sizes</ax-subtitle>
  </div>

  <div class="flex items-center gap-2">
    <span class="text-sm font-medium">Container Size:</span>
    <ax-select-box
      [dataSource]="sizes()"
      [ngModel]="selectedSize()"
      (onValueChanged)="onSizeChange($event.value)"
      style="width: 200px"
    ></ax-select-box>
  </div>

  <div
    class="border-2 border-dashed border-gray-300 rounded-lg overflow-hidden"
    [style.width]="currentSize().width"
    [style.height]="currentSize().height"
  >
    <ax-scheduler
      [selectedView]="'month'"
      [startingDate]="startingDate()"
      [dataSource]="appointmentsData()"
      [allowFullScreen]="allowFullScreen()"
    ></ax-scheduler>
  </div>
</div>
