<div class="w-[100vw] h-[100vh] p-4">
  @defer(){
  <ax-scheduler
    [hasActions]="true"
    [selectedView]="'month'"
    [startingDate]="startingDate()"
    [dataSource]="appointmentsData()"
    (onActionClick)="onActionClick($event)"
    class="bg-lightest dark:bg-darkest"
  ></ax-scheduler>
  }
  <ax-context-menu
    #contextMenu
    (onOpening)="handleOpening($event)"
    (onItemClick)="onContextMenuItemClick($event)"
  ></ax-context-menu>
</div>
