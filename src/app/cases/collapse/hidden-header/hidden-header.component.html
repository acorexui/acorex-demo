<div class="flex flex-col items-center justify-center gap-2">
  <div class="flex gap-2">
    <ax-button
      look="outline"
      [text]="'Toggle Header'"
      (onClick)="showHeader = !showHeader"
    ></ax-button>
  </div>
  <ax-collapse
    [showHeader]="showHeader"
    caption="Hidden Header"
    class="container px-12"
  >
    <p>The header can be toggled off; the body remains accessible.</p>
  </ax-collapse>
</div>
