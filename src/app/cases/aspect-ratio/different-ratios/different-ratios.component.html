<div
  class="flex flex-col items-center justify-center gap-6 p-4"
>
  <div
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-4xl h-[90vh] w-[90vw]"
  >
    <div class="flex flex-col gap-2">
      <ax-label>Square (1:1)</ax-label>
      <ax-aspect-ratio
        [ratio]="1"
        class="w-full border border-surface rounded-lg overflow-hidden"
      >
        <div
          class="bg-red-500 h-full flex items-center justify-center text-white font-bold"
        >
          1:1
        </div>
      </ax-aspect-ratio>
    </div>

    <div class="flex flex-col gap-2">
      <ax-label>Standard (4:3)</ax-label>
      <ax-aspect-ratio
        [ratio]="4 / 3"
        class="w-full border border-surface rounded-lg overflow-hidden"
      >
        <div
          class="bg-green-500 h-full flex items-center justify-center text-white font-bold"
        >
          4:3
        </div>
      </ax-aspect-ratio>
    </div>

    <div class="flex flex-col gap-2">
      <ax-label>Widescreen (16:9)</ax-label>
      <ax-aspect-ratio
        [ratio]="16 / 9"
        class="w-full border border-surface rounded-lg overflow-hidden"
      >
        <div
          class="bg-blue-500 h-full flex items-center justify-center text-white font-bold"
        >
          16:9
        </div>
      </ax-aspect-ratio>
    </div>

    <div class="flex flex-col gap-2">
      <ax-label>Photo (3:2)</ax-label>
      <ax-aspect-ratio
        [ratio]="3 / 2"
        class="w-full border border-surface rounded-lg overflow-hidden"
      >
        <div
          class="bg-yellow-500 h-full flex items-center justify-center text-white font-bold"
        >
          3:2
        </div>
      </ax-aspect-ratio>
    </div>

    <div class="flex flex-col gap-2">
      <ax-label>Ultrawide (21:9)</ax-label>
      <ax-aspect-ratio
        [ratio]="21 / 9"
        class="w-full border border-surface rounded-lg overflow-hidden"
      >
        <div
          class="bg-purple-500 h-full flex items-center justify-center text-white font-bold"
        >
          21:9
        </div>
      </ax-aspect-ratio>
    </div>

    <div class="flex flex-col gap-2">
      <ax-label>Cinema (2:1)</ax-label>
      <ax-aspect-ratio
        [ratio]="2"
        class="w-full border border-surface rounded-lg overflow-hidden mb-4"
      >
        <div
          class="bg-pink-500 h-full flex items-center justify-center text-white font-bold"
        >
          2:1
        </div>
      </ax-aspect-ratio>
    </div>
  </div>
</div>
