<div
  class="flex flex-col items-center justify-center gap-4 p-4"
>
  <ax-aspect-ratio
    [ratio]="currentRatio()"
    class="w-full max-w-md border border-surface rounded-lg overflow-hidden"
  >
    <div
      class="bg-gradient-to-br from-blue-500 to-purple-600 h-full flex items-center justify-center text-white font-bold text-xl"
    >
      Content with {{ currentRatio() | number : "1.1-1" }}:1 ratio
    </div>
  </ax-aspect-ratio>

  <div class="flex gap-2 justify-center items-center w-full">
    <ax-label class="text-nowrap">Preset Ratios:</ax-label>
    <ax-select-box
      textField="label"
      valueField="value"
      [ngModel]="selectedRatio()"
      placeholder="Select ratio"
      [dataSource]="ratioOptions"
      (valueChange)="onPresetRatioChange($event)"
    >
    </ax-select-box>
  </div>

  <div class="flex gap-2 justify-center items-center">
    <ax-label>Custom Ratio:</ax-label>
    <ax-number-box
      [step]="0.1"
      [decimals]="1"
      [maxValue]="10"
      [minValue]="0.5"
      [value]="customRatio()"
      placeholder="Enter ratio"
      (valueChange)="onCustomRatioChange($event)"
    >
    </ax-number-box>
  </div>
</div>
