<div
  class="case-toolbar"
  style="
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  "
>
  <ax-button
    text="Add 2x2 at empty space"
    type="button"
    (click)="addWidget()"
  ></ax-button>
  <ax-button text="Compact" type="button" (click)="compact()"></ax-button>
  <ax-button text="Remove all" type="button" (click)="clearAll()"></ax-button>

  <ax-select-box
    class="w-40"
    textField="text"
    valueField="value"
    [(ngModel)]="columns"
    [dataSource]="columnDataSource()"
    (ngModelChange)="setCols($event)"
  ></ax-select-box>

  <ax-select-box
    class="w-40"
    textField="text"
    valueField="value"
    [(ngModel)]="cellHeight"
    [dataSource]="cellHeightDataSource()"
    (ngModelChange)="setCellHeight($event)"
  ></ax-select-box>
</div>

<ax-grid-layout-container #grid [options]="containerOptions()">
  @for (w of [ { x: 0, y: 0, width: 3, height: 2, label: 'Start A (3x2)' }, { x:
  3, y: 0, width: 3, height: 2, label: 'Start B (3x2)' }, ]; track w) {
  <ax-grid-layout-widget [options]="w">
    <div style="padding: 12px">{{ w.label }}</div>
  </ax-grid-layout-widget>
  }
</ax-grid-layout-container>
