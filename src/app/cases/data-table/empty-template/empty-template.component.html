<div class="h-[500px] w-full max-w-[800px]">
  <ax-data-table
    [dataSource]="emptyTableDataSource"
    [paging]="false"
    [alternative]="true"
    [emptyTemplate]="dataTableEmptyTpl"
  >
    <ax-text-column
      [dataField]="'firstName'"
      caption="First Name"
    ></ax-text-column>
    <ax-text-column
      [dataField]="'lastName'"
      caption="Last Name"
    ></ax-text-column>
    <ax-text-column [dataField]="'email'" caption="Email"></ax-text-column>
    <ng-template #dataTableEmptyTpl>
      <div
        class="text-on-surface/75 flex flex-col items-center justify-center gap-2 py-4"
      >
        <i class="ax-icon ax-icon-inbox text-3xl" aria-hidden="true"></i>
        <span class="font-medium">No records found</span>
        <span class="text-sm">Try changing filters or add a new row.</span>
        <ax-button
          class="ax-sm"
          text="Refresh"
          look="outline"
          (onClick)="refreshEmptyTable()"
        ></ax-button>
      </div>
    </ng-template>
  </ax-data-table>
</div>
