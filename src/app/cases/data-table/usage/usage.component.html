<div class="max-w-[40rem]">
  <!--
    Deferred so the data-table is not rendered during SSR/prerendering:
    the library's text-highlight cleanup accesses `document` on destroy,
    which crashes the prerender worker on the server.
  -->
  @defer (on idle) {
  <ax-data-table
    (selectedRowsChange)="handleSelectionChange($event)"
    [dataSource]="dataSource"
  >
    <ax-index-column [width]="'60px'" fixed="start"> </ax-index-column>
    <ax-select-column [width]="'50px'" fixed="start"> </ax-select-column>
    <ax-text-column
      name="firstName"
      [width]="'180px'"
      [dataField]="'firstName'"
      caption="First Name"
    ></ax-text-column>

    <ax-text-column
      [allowResizing]="true"
      name="lastName"
      [width]="'180px'"
      [dataField]="'lastName'"
      caption="Last Name"
    >
    </ax-text-column>

    <ax-text-column
      name="mobile"
      [width]="'180px'"
      [dataField]="'mobile'"
      caption="mobile"
    >
    </ax-text-column>
  </ax-data-table>
  } @placeholder {
  <div
    class="flex h-64 items-center justify-center rounded border border-dashed"
  >
    <span>Loading table...</span>
  </div>
  }
</div>
