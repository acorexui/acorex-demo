<div class="flex w-96 flex-col items-stretch gap-4">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentLook"
    [dataSource]="dataSource()"
  ></ax-select-box>

  <ax-bottom-navigation [look]="currentLook()" (onItemClick)="handleItemClick($event)">
    <ax-bottom-navigation-item name="home" [active]="'home' === selectedItem()">
      <ax-icon class="fa-light fa-house"> </ax-icon>
      <ax-text> Home </ax-text>
    </ax-bottom-navigation-item>
    <ax-bottom-navigation-item name="favorite" [active]="'favorite' === selectedItem()">
      <ax-icon class="fa-light fa-heart"> </ax-icon>
      <ax-text> Favorite </ax-text>
    </ax-bottom-navigation-item>
    <ax-bottom-navigation-item name="profile" [active]="'profile' === selectedItem()">
      <ax-icon class="fa-light fa-user"> </ax-icon>
      <ax-text> Profile </ax-text>
    </ax-bottom-navigation-item>
  </ax-bottom-navigation>
</div>
