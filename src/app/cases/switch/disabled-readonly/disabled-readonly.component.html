<div class="flex w-52 flex-col items-stretch gap-4 py-6">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentState"
    [dataSource]="dataSource()"
  ></ax-select-box>

  <ax-switch
    color="primary"
    [(ngModel)]="value"
    [readonly]="isReadonly()"
    [disabled]="isDisabled()"
    [isLoading]="isLoading()"
  ></ax-switch>
</div>
