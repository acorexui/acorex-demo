<div class="flex w-52 flex-col items-stretch gap-4 py-6">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentSize"
    [dataSource]="dataSource()"
  ></ax-select-box>

  <ax-switch
    [class]="currentSize()"
    color="primary"
    [(ngModel)]="value"
  ></ax-switch>
</div>
