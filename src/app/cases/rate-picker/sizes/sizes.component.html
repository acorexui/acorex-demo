<div class="flex w-80 flex-col items-stretch gap-4 p-4">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentSize"
    [dataSource]="dataSource()"
  ></ax-select-box>

  <ax-rate-picker
    [max]="5"
    [class]="currentSize()"
    [(ngModel)]="value"
    [iconName]="'fa-star'"
  ></ax-rate-picker>
</div>
