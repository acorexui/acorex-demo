<div class="flex w-80 flex-col items-stretch gap-4 p-4">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentState"
    [dataSource]="dataSource()"
  ></ax-select-box>

  <ax-rate-picker
    [max]="5"
    class="ax-md"
    [(ngModel)]="value"
    [iconName]="'fa-star'"
    [readonly]="isReadonly()"
    [disabled]="isDisabled()"
  ></ax-rate-picker>
</div>
