<div
  class="flex flex-col gap-4 h-60 items-center justify-center"
>
  <div class="flex flex-col items-center justify-center gap-2">
    <div class="text-sm text-muted">
      openOn: 'click' • closeOn: 'leave'
    </div>
    <ax-menu [orientation]="'vertical'" [openOn]="'click'" [closeOn]="'leave'">
      <ax-menu-item>
        <ax-text>File</ax-text>
        <ax-menu-item>
          <ax-text>Open</ax-text>
        </ax-menu-item>
        <ax-menu-item>
          <ax-text>Save</ax-text>
        </ax-menu-item>
      </ax-menu-item>
      <ax-menu-item>
        <ax-text>Edit</ax-text>
        <ax-menu-item>
          <ax-text>Undo</ax-text>
        </ax-menu-item>
      </ax-menu-item>
    </ax-menu>
  </div>
  <div class="flex flex-col items-center justify-center gap-2">
    <div class="text-sm text-muted">
      openOn: 'hover' • closeOn: 'click'
    </div>
    <ax-menu [orientation]="'vertical'" [openOn]="'hover'" [closeOn]="'click'">
      <ax-menu-item>
        <ax-text>File</ax-text>
        <ax-menu-item>
          <ax-text>Open</ax-text>
        </ax-menu-item>
        <ax-menu-item>
          <ax-text>Save</ax-text>
        </ax-menu-item>
      </ax-menu-item>
      <ax-menu-item>
        <ax-text>Edit</ax-text>
        <ax-menu-item>
          <ax-text>Undo</ax-text>
        </ax-menu-item>
      </ax-menu-item>
    </ax-menu>
  </div>
</div>
