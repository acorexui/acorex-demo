<div class="flex w-72 flex-col gap-4">
    <ax-combo-box [items]="fruits" [(value)]="decoratorValue" placeholder="Select a fruit">
      <ax-prefix>
        <ax-icon icon="fa-solid fa-magnifying-glass"></ax-icon>
      </ax-prefix>
      <ax-suffix>
        <ax-text>FR</ax-text>
      </ax-suffix>
    </ax-combo-box>

    <ax-combo-box
      [items]="countries"
      [(value)]="decoratorSelectValue"
      placeholder="Select a country"
    >
      <ax-prefix>
        <ax-icon icon="fa-solid fa-globe"></ax-icon>
      </ax-prefix>
      <ax-suffix>
        <ax-icon icon="fa-regular fa-flag"></ax-icon>
      </ax-suffix>
    </ax-combo-box>
  </div>
