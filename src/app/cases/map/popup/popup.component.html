<div class="w-full h-96 border rounded">
  <ax-map
    [latitude]="latitude()"
    [longitude]="longitude()"
    [zoomLevel]="zoomLevel()"
    [markers]="markers()"
    [addMarkerOnTap]="addMarkerOnTap()"
    (onMarkerClick)="onMarkerClick($event)"
    (onMarkerAdded)="onMarkerAdded($event)"
  >
  </ax-map>
</div>
