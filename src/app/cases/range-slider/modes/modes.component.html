<div class="flex flex-col gap-6 p-4">
  <ax-range-slider
    class="w-80 h-5"
    [(ngModel)]="singleValue"
    [mode]="'single'"
    [min]="0"
    [max]="100"
    [step]="1"
    [color]="'primary'"
  ></ax-range-slider>

  <ax-range-slider
    class="w-80 h-5"
    [(ngModel)]="dualValue"
    [mode]="'dual'"
    [min]="0"
    [max]="100"
    [step]="1"
    [color]="'primary'"
  ></ax-range-slider>
</div>
