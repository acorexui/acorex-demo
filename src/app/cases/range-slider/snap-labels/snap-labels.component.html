<div class="flex flex-col gap-6 p-4">
  <ax-range-slider
    class="w-80 h-5"
    [(ngModel)]="value1"
    [mode]="'single'"
    [min]="0"
    [max]="100"
    [step]="1"
    [hasSnap]="true"
    [snap]="10"
    [hasLable]="false"
    [color]="'primary'"
  ></ax-range-slider>

  <ax-range-slider
    class="w-80 h-5"
    [(ngModel)]="value2"
    [mode]="'single'"
    [min]="0"
    [max]="100"
    [step]="1"
    [hasSnap]="true"
    [snap]="10"
    [hasLable]="true"
    [color]="'primary'"
  ></ax-range-slider>
</div>
