<div class="flex w-80 flex-col items-stretch gap-4 p-4">
  <div class="flex items-center gap-2">
    <span>0</span>
    <ax-range-slider
      class="h-5 min-w-0 flex-1"
      [(ngModel)]="value"
      [mode]="'single'"
      [min]="0"
      [max]="currentMax()"
      [step]="1"
      [color]="'primary'"
      [hasTooltip]="true"
    ></ax-range-slider>
    <span>{{ currentMax() }}</span>
  </div>

  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentMax"
    [dataSource]="dataSource()"
  ></ax-select-box>
</div>
