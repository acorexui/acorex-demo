<div class="flex w-80 flex-col items-stretch gap-4 p-4">
  <ax-select-box
    textField="text"
    valueField="value"
    [(ngModel)]="currentState"
    [dataSource]="dataSource()"
  ></ax-select-box>

  <ax-range-slider
    class="h-5 w-full"
    [(ngModel)]="value"
    [mode]="'single'"
    [min]="0"
    [max]="100"
    [step]="1"
    [color]="'primary'"
    [readonly]="isReadonly()"
    [disabled]="isDisabled()"
  ></ax-range-slider>
</div>
