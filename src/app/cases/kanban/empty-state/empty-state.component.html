<div class="max-w-[100vw] max-h-[100vh]">
  <ax-kanban
    class="p-4"
    [statuses]="statuses()"
    [emptyTemplate]="empty"
    [dataSource]="dataSource()"
    (onSortChanged)="sort($event)"
  ></ax-kanban>
</div>

<ng-template #empty>
  <div class="flex flex-col items-center justify-center h-full">
    <ax-subtitle>No tasks found!</ax-subtitle>
  </div>
</ng-template>
