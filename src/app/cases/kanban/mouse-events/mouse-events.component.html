<div
  class="flex flex-col h-full gap-4 p-4 max-w-[100vw] max-h-[100vh]"
>
  <!-- Event Display Panel -->
  <div class="flex flex-col gap-2 p-4 surface rounded-lg">
    <ax-title class="text-lg">Event Log</ax-title>
    <div class="flex gap-4 items-center">
      <div class="flex-1">
        <ax-subtitle> Last Event: </ax-subtitle>
        <div
          class="text-sm font-mono lighter-surface p-2 rounded border"
        >
          {{ lastEvent() || "No events yet" }}
        </div>
      </div>
      <div class="flex-1">
        <ax-subtitle>Selected Item:</ax-subtitle>
        <div
          class="text-sm font-mono lighter-surface p-2 rounded border"
        >
          {{ selectedItem() ? selectedItem()?.title : "None" }}
        </div>
      </div>
      <ax-button
        text="Clear"
        look="outline"
        class="self-end"
        (click)="clearSelection()"
      ></ax-button>
    </div>
  </div>

  <!-- Kanban Board -->
  <ax-kanban
    [statuses]="statuses()"
    [dataSource]="dataSource()"
    (onSortChanged)="sort($event)"
    (onItemClick)="handleItemClick($event)"
    (onItemDblClick)="handleItemDblClick($event)"
    (onItemRightClick)="handleItemRightClick($event)"
  ></ax-kanban>
</div>
