<div class="max-w-[100vw] max-h-[100vh]">
  <ax-kanban
    class="p-4"
    [statuses]="statuses()"
    [dataSource]="dataSource()"
    (onSortChanged)="sort($event)"
    [tooltipTemplate]="tooltipTemplate"
  ></ax-kanban>
</div>

<!-- Custom Tooltip Template -->
<ng-template #tooltipTemplate let-item>
  @if (item.id === 2) {
  <div
    class="flex flex-col gap-2 p-3 max-w-xs surface rounded-lg shadow-lg border"
  >
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
      <span class="font-medium">{{ item.title }}</span>
    </div>
    <p class="text-sm text-muted">{{ item.description }}</p>
    <div class="flex justify-between items-center text-xs">
      <span>Priority: {{ item.priority || "none" }}</span>
      <span>Status: {{ item.statusKey }}</span>
    </div>
  </div>
  } @else {
  <div class="p-2 surface rounded shadow border">
    <div class="font-medium">{{ item.title }}</div>
    <div class="text-sm text-muted">{{ item.description }}</div>
  </div>
  }
</ng-template>
