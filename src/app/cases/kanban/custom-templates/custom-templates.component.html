<div class="max-w-[100vw] max-h-[100vh]">
  <ax-kanban
    class="p-4"
    [itemTemplate]="item"
    [statuses]="statuses()"
    [headerTemplate]="header"
    [footerTemplate]="footer"
    [dataSource]="dataSource()"
    (onSortChanged)="sort($event)"
    [contentFooterTemplate]="contentFooter"
  ></ax-kanban>
</div>

<!-- Custom Header Template -->
<ng-template #header let-status>
  <div class="flex flex-col gap-2 px-4 py-2">
    <ax-title>{{ status.title }}</ax-title>
    <ax-subtitle class="text-xs opacity-70">
      {{ getItemCount(status.key) }} items
    </ax-subtitle>
  </div>
</ng-template>

<!-- Custom Footer Template -->
<ng-template #footer let-status>
  <div
    class="flex justify-between items-center text-xs opacity-70 px-4 py-2 w-full"
  >
    <span>Total: {{ getItemCount(status.key) }}</span>
    <span>
      High:
      {{
        getPriorityCount(status.key, "high") +
          getPriorityCount(status.key, "highest")
      }}
    </span>
  </div>
</ng-template>

<!-- Custom Content Footer Template -->
<ng-template #contentFooter let-status>
  <div class="flex justify-center py-2">
    <ax-button
      class="ax-sm"
      look="outline"
      [text]="`Add Item to ${ status.title }`"
    ></ax-button>
  </div>
</ng-template>

<!-- Custom Item Template -->
<ng-template #item let-item>
  <div
    class="flex flex-col gap-2 p-3 surface rounded-lg shadow-sm border"
  >
    <div class="flex justify-between items-start">
      <ax-title class="text-sm font-medium">{{ item.title }}</ax-title>
      <div
        class="text-xs px-2 py-1 rounded-full"
        [ngClass]="{
          'ax-bg-red-100 ax-text-red-800 dark:ax-bg-red-900 dark:ax-text-red-200':
            item.priority === 'highest',
          'ax-bg-orange-100 ax-text-orange-800 dark:ax-bg-orange-900 dark:ax-text-orange-200':
            item.priority === 'high',
          'ax-bg-yellow-100 ax-text-yellow-800 dark:ax-bg-yellow-900 dark:ax-text-yellow-200':
            item.priority === 'medium',
          'ax-bg-green-100 ax-text-green-800 dark:ax-bg-green-900 dark:ax-text-green-200':
            item.priority === 'low',
          'ax-bg-blue-100 ax-text-blue-800 dark:ax-bg-blue-900 dark:ax-text-blue-200':
            item.priority === 'lowest',
          'ax-bg-gray-100 ax-text-gray-800 dark:ax-bg-gray-700 dark:ax-text-gray-200':
            !item.priority
        }"
      >
        {{ item.priority || "none" }}
      </div>
    </div>
    <ax-subtitle>{{ item.description }}</ax-subtitle>
    <div
      class="flex justify-between items-center text-xs text-muted"
    >
      <span>ID: {{ item.id }}</span>
      <span>{{ item.statusKey }}</span>
    </div>
  </div>
</ng-template>
