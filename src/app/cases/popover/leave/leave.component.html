<div class="flex h-[300px] w-full items-center justify-center">
  <ax-button [text]="leaveButtonText" #leaveBtn color="primary"></ax-button>
</div>
<ax-popover
  openOn="hover"
  closeOn="leave"
  (onOpened)="changeButtonText('Leave to Close')"
  (onClosed)="changeButtonText('Hover to Open')"
  [target]="leaveBtn"
>
  <div class="overlay-pane p-4">
    <b class="text-sm">Title</b>
    <br />
    <small>This popover close when you leave the button</small>
  </div>
</ax-popover>
