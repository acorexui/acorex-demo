<div class="flex h-[300px] w-full items-center justify-center">
  <ax-button text="Show Popover" #methodsBtn color="primary"></ax-button>
</div>
<ax-popover
  openOn="click"
  closeOn="clickOut"
  [target]="methodsBtn"
  (onOpened)="writeLog('opened')"
  (onClosed)="writeLog('closed')"
>
  <div class="overlay-pane p-4">
    <b class="text-sm">Title</b>
    <br />
    <small>Lorem, ipsum dolor sit amet consectetur adipisicing elit</small>
  </div>
</ax-popover>
